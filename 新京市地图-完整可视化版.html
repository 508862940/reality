        ];

        function resize() {
            c.width = cont.clientWidth;
            c.height = cont.clientHeight;
            offset.x = c.width / 2 - 400 * zoom;
            offset.y = c.height / 2 - 400 * zoom;
            render();
        }

        window.addEventListener('resize', resize);
        resize();

        function render() {
            const cx = 400 * zoom + offset.x;
            const cy = 400 * zoom + offset.y;

            // 清空画布
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, c.width, c.height);

            // 绘制海洋背景
            const oceanGradient = ctx.createRadialGradient(cx, cy, 370*zoom, cx, cy, 450*zoom);
            oceanGradient.addColorStop(0, 'transparent');
            oceanGradient.addColorStop(1, 'rgba(0, 105, 148, 0.3)');
            ctx.fillStyle = oceanGradient;
            ctx.fillRect(0, 0, c.width, c.height);

            // 绘制区域扇形
            if (showSectors) {
                Object.entries(sectors).forEach(([name, sector]) => {
                    if (sector.angle) {
                        ctx.fillStyle = sector.color;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.arc(cx, cy, 380*zoom,
                            (sector.angle.start - 90) * Math.PI / 180,
                            (sector.angle.end - 90) * Math.PI / 180);
                        ctx.closePath();
                        ctx.fill();

                        // 区域标签
                        const midAngle = ((sector.angle.start + sector.angle.end) / 2 - 90) * Math.PI / 180;
                        const labelRadius = 320 * zoom;
                        const labelX = cx + Math.cos(midAngle) * labelRadius;
                        const labelY = cy + Math.sin(midAngle) * labelRadius;

                        ctx.fillStyle = sector.color.replace('0.1', '0.8');
                        ctx.font = `bold ${14*zoom}px Microsoft YaHei`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(name, labelX, labelY);
                    } else if (name === "天枢区") {
                        // 中心区域
                        ctx.fillStyle = sector.color;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 80*zoom, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }

            // 绘制环线
            if (showRings) {
                [120, 200, 280, 360].forEach((r, i) => {
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r * zoom, 0, Math.PI * 2);
                    ctx.stroke();

                    // 环层标签
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
                    ctx.font = `${10*zoom}px Microsoft YaHei`;
                    ctx.textAlign = 'center';
                    ctx.fillText(`第${i+1}环`, cx, cy - r*zoom - 10);
                });
            }

            // 绘制街道网络（先于地铁绘制，在底层）
            if (showStreets) {
                streetNetwork.forEach(street => {
                    const nodes = street.nodes.map(id =>
                        data.nodes.find(n => n.id === id)
                    ).filter(n => n);

                    if (nodes.length > 1) {
                        ctx.strokeStyle = street.color;
                        ctx.lineWidth = street.width * zoom;
                        ctx.globalAlpha = street.important ? 0.4 : 0.25;  // 降低透明度：0.8→0.4, 0.5→0.25

                        // 虚线样式（边缘公路）
                        if (street.dash) {
                            ctx.setLineDash(street.dash.map(d => d * zoom));
                        } else {
                            ctx.setLineDash([]);
                        }

                        ctx.beginPath();
                        nodes.forEach((node, i) => {
                            const x = node.x * zoom + offset.x;
                            const y = node.y * zoom + offset.y;
                            if (i === 0) {
                                ctx.moveTo(x, y);
                            } else {
                                ctx.lineTo(x, y);
                            }
                        });
                        ctx.stroke();

                        // 重要街道标记（发光效果）
                        if (street.important && zoom > 0.8) {
                            ctx.globalAlpha = 0.15;  // 降低发光透明度：0.3→0.15
                            ctx.strokeStyle = street.color;
                            ctx.lineWidth = street.width * zoom * 2.5;
                            ctx.beginPath();
                            nodes.forEach((node, i) => {
                                const x = node.x * zoom + offset.x;
                                const y = node.y * zoom + offset.y;
                                if (i === 0) {
                                    ctx.moveTo(x, y);
                                } else {
                                    ctx.lineTo(x, y);
                                }
                            });
                            ctx.stroke();

                            // 街道名称标签
                            if (nodes.length >= 2) {
                                const midIndex = Math.floor(nodes.length / 2);
                                const midNode = nodes[midIndex];
                                const x = midNode.x * zoom + offset.x;
                                const y = midNode.y * zoom + offset.y;

                                ctx.globalAlpha = 1;
                                ctx.fillStyle = street.color;
                                ctx.font = `bold ${10*zoom}px Microsoft YaHei`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(street.name, x, y - 20*zoom);
                            }
                        }

                        ctx.globalAlpha = 1; // 重置透明度
                    }
                });
            }

            // 绘制地铁线路
            if (showSubway) {
                subwayLines.forEach(line => {
                    const stations = line.stations.map(id =>
                        data.nodes.find(n => n.id === id)
                    ).filter(n => n);

                    if (stations.length > 1) {
                        ctx.strokeStyle = line.color;
                        ctx.lineWidth = 4 * zoom;
                        ctx.setLineDash([]);

                        ctx.beginPath();
                        stations.forEach((station, i) => {
                            const x = station.x * zoom + offset.x;
                            const y = station.y * zoom + offset.y;
                            if (i === 0) {
                                ctx.moveTo(x, y);
                            } else {
                                ctx.lineTo(x, y);
                            }
                        });
                        ctx.stroke();
                    }
                });
            }

            // 绘制节点
            data.nodes.forEach(n => {
                const x = n.x * zoom + offset.x;
                const y = n.y * zoom + offset.y;
                const s = n.size * zoom;

                // 光晕
                if (n === hover || n === sel) {
                    const g = ctx.createRadialGradient(x, y, 0, x, y, s * 2.5);
                    g.addColorStop(0, n.color + '60');
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(x, y, s * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 节点圆形
                ctx.fillStyle = n.color;
                ctx.beginPath();
                ctx.arc(x, y, s, 0, Math.PI * 2);
                ctx.fill();

                // 边框
                ctx.strokeStyle = n === sel ? '#fff' : 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = n === sel ? 4 : 2;
                ctx.beginPath();
                ctx.arc(x, y, s, 0, Math.PI * 2);
                ctx.stroke();

                // 地铁站标记
                if (n.subway && showSubway) {
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${8*zoom}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🚇', x, y - s - 12*zoom);
                }

                // 文字
                ctx.fillStyle = '#fff';
                ctx.font = `${Math.max(10, 12*zoom)}px Microsoft YaHei`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.name, x, y);
            });
        }

        function getNode(x, y) {
            for (let i = data.nodes.length - 1; i >= 0; i--) {
                const n = data.nodes[i];
                const nx = n.x * zoom + offset.x;
                const ny = n.y * zoom + offset.y;
                if (Math.sqrt((x - nx) ** 2 + (y - ny) ** 2) <= n.size * zoom) {
                    return n;
                }
            }
            return null;
        }

        c.addEventListener('mousedown', e => {
            const n = getNode(e.offsetX, e.offsetY);
            if (!n) {
                drag = true;
                last = {x: e.offsetX, y: e.offsetY};
            }
        });

        c.addEventListener('mousemove', e => {
            if (drag) {
                offset.x += e.offsetX - last.x;
                offset.y += e.offsetY - last.y;
                last = {x: e.offsetX, y: e.offsetY};
                render();
            } else {
                const n = getNode(e.offsetX, e.offsetY);
                if (n !== hover) {
                    hover = n;
                    c.style.cursor = n ? 'pointer' : 'grab';
                    render();
                }
            }
        });

        c.addEventListener('mouseup', () => drag = false);

        // 查找经过某个节点的所有街道
        function getStreetsForNode(nodeId) {
            return streetNetwork.filter(street =>
                street.nodes.includes(nodeId)
            ).map(street => street.name);
        }

        c.addEventListener('click', e => {
            if (!drag) {
                const n = getNode(e.offsetX, e.offsetY);
                if (n) {
                    sel = n;
                    document.getElementById('nodeInfo').style.display = 'block';
                    document.getElementById('infoName').textContent = n.name;
                    document.getElementById('infoSector').textContent = n.sector;
                    document.getElementById('infoRing').textContent = `第${n.ring}环`;
                    document.getElementById('infoType').textContent = n.type;
                    document.getElementById('infoSubway').textContent = n.subway || '无地铁站';

                    // 显示连接的街道
                    const streets = getStreetsForNode(n.id);
                    if (streets.length > 0) {
                        document.getElementById('infoStreets').textContent = streets.join('、');
                    } else {
                        document.getElementById('infoStreets').textContent = '无街道经过';
                    }

                    render();
                } else {
                    sel = null;
                    document.getElementById('nodeInfo').style.display = 'none';
                    render();
                }
            }
        });

        c.addEventListener('wheel', e => {
            e.preventDefault();
            const d = e.deltaY > 0 ? 0.9 : 1.1;
            const oz = zoom;
            zoom = Math.max(0.3, Math.min(3, zoom * d));
            offset.x = e.offsetX - (e.offsetX - offset.x) * (zoom / oz);
            offset.y = e.offsetY - (e.offsetY - offset.y) * (zoom / oz);
            render();
        });

        function toggleRings() {
            showRings = !showRings;
            document.getElementById('btnRings').classList.toggle('active', showRings);
            render();
        }

        function toggleSectors() {
            showSectors = !showSectors;
            document.getElementById('btnSectors').classList.toggle('active', showSectors);
            render();
        }

        function toggleSubway() {
            showSubway = !showSubway;
            document.getElementById('btnSubway').classList.toggle('active', showSubway);
            render();
        }

        function toggleStreets() {
            showStreets = !showStreets;
            document.getElementById('btnStreets').classList.toggle('active', showStreets);
            render();
        }

        function exportImage() {
            const link = document.createElement('a');
            link.download = '新京市地图-完整版-' + new Date().getTime() + '.png';
            link.href = c.toDataURL();
            link.click();
        }
    </script>
</body>
