<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气卡片动画展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .cards-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
        }

        .weather-card {
            width: 280px;
            height: 400px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-10px);
        }

        .weather-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 25px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .weather-type {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .temperature {
            font-size: 3em;
            font-weight: bold;
        }

        /* ========== SUN CARD ========== */
        .sun-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .sun {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 60px #FFD700;
            animation: sunPulse 3s ease-in-out infinite;
        }

        .sun-ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 60px;
            background: linear-gradient(to bottom, #FFD700, transparent);
            transform-origin: top center;
        }

        .sun-ray:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
        .sun-ray:nth-child(2) { transform: translate(-50%, -100%) rotate(45deg); }
        .sun-ray:nth-child(3) { transform: translate(-50%, -100%) rotate(90deg); }
        .sun-ray:nth-child(4) { transform: translate(-50%, -100%) rotate(135deg); }
        .sun-ray:nth-child(5) { transform: translate(-50%, -100%) rotate(180deg); }
        .sun-ray:nth-child(6) { transform: translate(-50%, -100%) rotate(225deg); }
        .sun-ray:nth-child(7) { transform: translate(-50%, -100%) rotate(270deg); }
        .sun-ray:nth-child(8) { transform: translate(-50%, -100%) rotate(315deg); }

        @keyframes sunPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        .sun-rays {
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -100%) rotate(0deg); }
            to { transform: translate(-50%, -100%) rotate(360deg); }
        }

        /* ========== RAIN CARD ========== */
        .rain-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .cloud {
            position: absolute;
            background: #e0e0e0;
            border-radius: 100px;
            opacity: 0.9;
        }

        .cloud-1 {
            width: 100px;
            height: 40px;
            top: 60px;
            left: 30px;
            animation: cloudFloat 4s ease-in-out infinite;
        }

        .cloud-1::before, .cloud-1::after {
            content: '';
            position: absolute;
            background: #e0e0e0;
            border-radius: 50%;
        }

        .cloud-1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud-1::after {
            width: 60px;
            height: 60px;
            top: -30px;
            right: 10px;
        }

        @keyframes cloudFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 15px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
            border-radius: 0 0 50% 50%;
            animation: rainfall linear infinite;
        }

        @keyframes rainfall {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(400px);
                opacity: 0;
            }
        }

        /* ========== SNOW CARD ========== */
        .snow-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 20px;
            animation: snowfall linear infinite;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes snowfall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(400px) rotate(360deg);
                opacity: 0.3;
            }
        }

        /* ========== WIND CARD ========== */
        .wind-card {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .wind-cloud {
            position: absolute;
            background: rgba(255,255,255,0.7);
            border-radius: 100px;
        }

        .wind-cloud-1 {
            width: 120px;
            height: 50px;
            top: 50px;
            animation: windMove1 3s ease-in-out infinite;
        }

        .wind-cloud-2 {
            width: 90px;
            height: 40px;
            top: 120px;
            animation: windMove2 2.5s ease-in-out infinite;
        }

        .wind-cloud-3 {
            width: 110px;
            height: 45px;
            top: 190px;
            animation: windMove3 3.5s ease-in-out infinite;
        }

        @keyframes windMove1 {
            0%, 100% { left: -50px; }
            50% { left: calc(100% + 50px); }
        }

        @keyframes windMove2 {
            0%, 100% { left: -30px; }
            50% { left: calc(100% + 30px); }
        }

        @keyframes windMove3 {
            0%, 100% { left: -40px; }
            50% { left: calc(100% + 40px); }
        }

        .wind-line {
            position: absolute;
            height: 2px;
            background: rgba(255,255,255,0.6);
            animation: windLineMove linear infinite;
        }

        @keyframes windLineMove {
            0% {
                left: -100%;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        .tree {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
        }

        .tree-trunk {
            width: 20px;
            height: 60px;
            background: #8B4513;
            margin: 0 auto;
            border-radius: 3px;
        }

        .tree-leaves {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 70px solid #228B22;
            margin: -10px auto 0;
            animation: treeSway 1.5s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes treeSway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Control Panel */
        .control-panel {
            margin-top: 40px;
            text-align: center;
        }

        .control-panel button {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .control-panel button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .control-panel button.active {
            background: rgba(255,255,255,0.4);
            border-color: white;
        }
    </style>
</head>
<body>
    <h1>⛅ 天气动画卡片展示</h1>

    <div class="cards-container">
        <!-- SUN CARD -->
        <div class="weather-card sun-card">
            <div class="sun">
                <div class="sun-rays">
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                    <div class="sun-ray"></div>
                </div>
            </div>
            <div class="weather-info">
                <div class="weather-type">☀️ 晴天</div>
                <div class="temperature">28°C</div>
            </div>
        </div>

        <!-- RAIN CARD -->
        <div class="weather-card rain-card">
            <div class="cloud cloud-1"></div>
            <div id="raindrops"></div>
            <div class="weather-info">
                <div class="weather-type">🌧️ 雨天</div>
                <div class="temperature">18°C</div>
            </div>
        </div>

        <!-- SNOW CARD -->
        <div class="weather-card snow-card">
            <div id="snowflakes"></div>
            <div class="weather-info">
                <div class="weather-type">❄️ 雪天</div>
                <div class="temperature">-2°C</div>
            </div>
        </div>

        <!-- WIND CARD -->
        <div class="weather-card wind-card">
            <div class="wind-cloud wind-cloud-1"></div>
            <div class="wind-cloud wind-cloud-2"></div>
            <div class="wind-cloud wind-cloud-3"></div>
            <div id="windLines"></div>
            <div class="tree">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
            <div class="weather-info">
                <div class="weather-type">💨 大风</div>
                <div class="temperature">22°C</div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <p style="margin-bottom: 15px; font-size: 18px;">🎮 动画控制：</p>
        <button onclick="toggleAnimation('sun')">☀️ 晴天动画</button>
        <button onclick="toggleAnimation('rain')">🌧️ 雨天动画</button>
        <button onclick="toggleAnimation('snow')">❄️ 雪天动画</button>
        <button onclick="toggleAnimation('wind')">💨 风天动画</button>
        <button onclick="toggleAnimation('all')" class="active">🌍 全部动画</button>
    </div>

    <script>
        // Generate raindrops
        const rainContainer = document.getElementById('raindrops');
        for (let i = 0; i < 50; i++) {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            drop.style.left = Math.random() * 100 + '%';
            drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            rainContainer.appendChild(drop);
        }

        // Generate snowflakes
        const snowContainer = document.getElementById('snowflakes');
        const snowflakeSymbols = ['❄', '❅', '❆'];
        for (let i = 0; i < 30; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.textContent = snowflakeSymbols[Math.floor(Math.random() * snowflakeSymbols.length)];
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.fontSize = (Math.random() * 15 + 10) + 'px';
            snowflake.style.animationDuration = (Math.random() * 3 + 3) + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowContainer.appendChild(snowflake);
        }

        // Generate wind lines
        const windContainer = document.getElementById('windLines');
        for (let i = 0; i < 15; i++) {
            const line = document.createElement('div');
            line.className = 'wind-line';
            line.style.top = (Math.random() * 60 + 20) + '%';
            line.style.width = (Math.random() * 80 + 40) + 'px';
            line.style.animationDuration = (Math.random() * 1 + 1) + 's';
            line.style.animationDelay = Math.random() * 2 + 's';
            windContainer.appendChild(line);
        }

        // Animation control
        const cards = document.querySelectorAll('.weather-card');
        const buttons = document.querySelectorAll('.control-panel button');

        function toggleAnimation(type) {
            // Update button states
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Control card animations
            cards.forEach(card => {
                if (type === 'all') {
                    card.style.display = 'block';
                } else {
                    if (card.classList.contains(type + '-card')) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                }
            });
        }

        // Interactive temperature update (optional enhancement)
        function updateTemperature(cardType, temp) {
            const card = document.querySelector(`.${cardType}-card .temperature`);
            if (card) {
                card.textContent = temp + '°C';
            }
        }

        // Auto-cycle demo (uncomment to enable)
        /*
        let currentWeather = 0;
        const weatherTypes = ['sun', 'rain', 'snow', 'wind'];
        setInterval(() => {
            currentWeather = (currentWeather + 1) % weatherTypes.length;
            toggleAnimation(weatherTypes[currentWeather]);
        }, 5000);
        */
    </script>
</body>
</html>
