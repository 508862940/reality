<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气特效演示 - Reality游戏</title>

    <!-- 引入天气特效样式 -->
    <link rel="stylesheet" href="css/weather-effects.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .demo-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .effect-button {
            padding: 20px;
            font-size: 1.2em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: bold;
        }

        .effect-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .effect-button.active {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .effect-button .icon {
            font-size: 2em;
            display: block;
            margin-bottom: 8px;
        }

        .intensity-control {
            margin-top: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .intensity-control h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .intensity-value {
            font-size: 1.3em;
            font-weight: bold;
            min-width: 60px;
            text-align: right;
        }

        .info-panel {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .info-panel h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.4em;
            font-weight: bold;
        }

        .clear-button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 1.1em;
            background: rgba(255, 59, 48, 0.3);
            border: 2px solid rgba(255, 59, 48, 0.5);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-button:hover {
            background: rgba(255, 59, 48, 0.5);
            transform: scale(1.02);
        }

        /* 背景场景 */
        .background-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(180deg,
                #1e3c72 0%,
                #2a5298 50%,
                #7e8ba3 100%);
            transition: background 2s ease;
        }

        .background-scene.day {
            background: linear-gradient(180deg,
                #87CEEB 0%,
                #98D8E8 50%,
                #B0E2FF 100%);
        }

        .background-scene.night {
            background: linear-gradient(180deg,
                #0B1026 0%,
                #1B2947 50%,
                #2C3E50 100%);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .demo-container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .effect-button {
                padding: 15px;
                font-size: 1em;
            }

            .info-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 背景场景 -->
    <div class="background-scene" id="backgroundScene"></div>

    <!-- 演示容器 -->
    <div class="demo-container">
        <h1>🌤️ 天气特效演示 v3.0</h1>
        <p class="subtitle">Reality游戏 - 8种天气视觉效果（雨天系统v3.0升级）</p>

        <!-- 特效按钮 -->
        <div class="controls">
            <button class="effect-button" data-effect="sakura">
                <span class="icon">🌸</span>
                <span>樱花飘落</span>
            </button>
            <button class="effect-button" data-effect="rainbow">
                <span class="icon">🌈</span>
                <span>雨后彩虹</span>
            </button>
            <button class="effect-button" data-effect="meteor_shower">
                <span class="icon">🌠</span>
                <span>流星雨</span>
            </button>
            <button class="effect-button" data-effect="polluted">
                <span class="icon">☢️</span>
                <span>污染雾霾</span>
            </button>
            <button class="effect-button" data-effect="rainy">
                <span class="icon">🌧️</span>
                <span>雨天</span>
            </button>
            <button class="effect-button" data-effect="stormy">
                <span class="icon">⛈️</span>
                <span>暴风雨</span>
            </button>
            <button class="effect-button" data-effect="snowy">
                <span class="icon">❄️</span>
                <span>雪天</span>
            </button>
        </div>

        <!-- 强度控制 -->
        <div class="intensity-control">
            <h3>⚡ 特效强度</h3>
            <div class="slider-container">
                <input
                    type="range"
                    class="slider"
                    id="intensitySlider"
                    min="0"
                    max="100"
                    value="100"
                    disabled
                >
                <span class="intensity-value" id="intensityValue">100%</span>
            </div>
        </div>

        <!-- 信息面板 -->
        <div class="info-panel">
            <h3>📊 特效信息</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">当前特效</div>
                    <div class="info-value" id="currentEffect">无</div>
                </div>
                <div class="info-item">
                    <div class="info-label">粒子数量</div>
                    <div class="info-value" id="particleCount">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">性能等级</div>
                    <div class="info-value" id="performanceLevel">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">特效状态</div>
                    <div class="info-value" id="effectStatus">待机</div>
                </div>
            </div>
        </div>

        <!-- 清除按钮 -->
        <button class="clear-button" id="clearButton">🗑️ 清除特效</button>
    </div>

    <!-- 引入天气特效控制器 -->
    <script src="js/core/weather-effect-controller.js"></script>

    <script>
        // 🔥 初始化天气特效控制器
        window.weatherEffectController = new WeatherEffectController();

        // 获取DOM元素
        const effectButtons = document.querySelectorAll('.effect-button');
        const intensitySlider = document.getElementById('intensitySlider');
        const intensityValue = document.getElementById('intensityValue');
        const clearButton = document.getElementById('clearButton');
        const backgroundScene = document.getElementById('backgroundScene');

        // 信息面板元素
        const currentEffectEl = document.getElementById('currentEffect');
        const particleCountEl = document.getElementById('particleCount');
        const performanceLevelEl = document.getElementById('performanceLevel');
        const effectStatusEl = document.getElementById('effectStatus');

        let currentActiveButton = null;

        // 初始化性能等级显示
        performanceLevelEl.textContent = window.weatherEffectController.performanceLevel.toUpperCase();

        // 特效按钮点击事件
        effectButtons.forEach(button => {
            button.addEventListener('click', () => {
                const effectType = button.getAttribute('data-effect');
                const intensity = intensitySlider.value / 100;

                // 显示特效
                window.weatherEffectController.showEffect(effectType, intensity);

                // 更新按钮状态
                if (currentActiveButton) {
                    currentActiveButton.classList.remove('active');
                }
                button.classList.add('active');
                currentActiveButton = button;

                // 启用强度滑块
                intensitySlider.disabled = false;

                // 更新信息面板
                updateInfoPanel();

                // 更新背景
                updateBackground(effectType);
            });
        });

        // 强度滑块事件
        intensitySlider.addEventListener('input', (e) => {
            const intensity = e.target.value / 100;
            intensityValue.textContent = `${e.target.value}%`;

            // 更新特效强度
            window.weatherEffectController.updateIntensity(intensity);

            // 更新信息面板
            updateInfoPanel();
        });

        // 清除按钮事件
        clearButton.addEventListener('click', () => {
            window.weatherEffectController.removeEffect();

            // 重置UI
            if (currentActiveButton) {
                currentActiveButton.classList.remove('active');
                currentActiveButton = null;
            }

            intensitySlider.disabled = true;
            intensitySlider.value = 100;
            intensityValue.textContent = '100%';

            // 重置信息面板
            currentEffectEl.textContent = '无';
            particleCountEl.textContent = '0';
            effectStatusEl.textContent = '待机';

            // 重置背景
            backgroundScene.className = 'background-scene';
        });

        // 更新信息面板
        function updateInfoPanel() {
            const info = window.weatherEffectController.getEffectInfo();

            const effectNames = {
                'sakura': '🌸 樱花飘落',
                'rainbow': '🌈 雨后彩虹',
                'meteor_shower': '🌠 流星雨',
                'polluted': '☢️ 污染雾霾',
                'rainy': '🌧️ 雨天',
                'stormy': '⛈️ 暴风雨',
                'snowy': '❄️ 雪天'
            };

            currentEffectEl.textContent = effectNames[info.type] || '无';
            particleCountEl.textContent = info.particleCount || 0;
            effectStatusEl.textContent = info.isActive ? '运行中' : '待机';
        }

        // 更新背景
        function updateBackground(effectType) {
            backgroundScene.className = 'background-scene';

            switch(effectType) {
                case 'sakura':
                case 'rainbow':
                    backgroundScene.classList.add('day');
                    break;
                case 'meteor_shower':
                    backgroundScene.classList.add('night');
                    break;
                case 'rainy':
                case 'stormy':
                case 'snowy':
                    // 阴天背景（默认渐变）
                    break;
                case 'polluted':
                    // 污染天（默认渐变+暗化）
                    break;
            }
        }

        // 快捷键支持
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1':
                    effectButtons[0].click();
                    break;
                case '2':
                    effectButtons[1].click();
                    break;
                case '3':
                    effectButtons[2].click();
                    break;
                case '4':
                    effectButtons[3].click();
                    break;
                case '5':
                    effectButtons[4].click();
                    break;
                case '6':
                    effectButtons[5].click();
                    break;
                case '7':
                    effectButtons[6].click();
                    break;
                case 'Escape':
                case 'c':
                case 'C':
                    clearButton.click();
                    break;
            }
        });

        // 提示信息
        console.log('%c🌤️ 天气特效演示系统 v3.0 已就绪', 'color: #667eea; font-size: 16px; font-weight: bold;');
        console.log('%c✨ 雨天系统v3.0：普通雨天 + 暴风雨（含闪电）', 'color: #10b981; font-size: 14px;');
        console.log('%c🌠 流星雨v3.0：真实物理辐射点 + 随机间隔 + 化学发光色', 'color: #10b981; font-size: 14px;');
        console.log('%c快捷键：1-7 切换特效 | Esc/C 清除特效', 'color: #999; font-size: 12px;');
    </script>
</body>
</html>
