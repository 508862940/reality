<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩虹系统完整测试 v5.3 - 透亮优化版</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 50%, #16213e 100%);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            z-index: 10000;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-panel h2 {
            margin-bottom: 20px;
            font-size: 1.4em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .control-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-section h3 {
            margin-bottom: 12px;
            font-size: 1.1em;
            color: #87ceeb;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .button-group.single {
            grid-template-columns: 1fr;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 0 20px rgba(245, 87, 108, 0.5);
        }

        button.danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        button.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        /* 状态显示 */
        .status-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #999;
            font-size: 0.9em;
        }

        .status-value {
            color: #fff;
            font-weight: bold;
        }

        .status-value.positive {
            color: #38ef7d;
        }

        .status-value.negative {
            color: #f45c43;
        }

        .status-value.warning {
            color: #ffd700;
        }

        /* 日志 */
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.85em;
            font-family: 'Consolas', monospace;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 5px;
            border-left: 3px solid #667eea;
            background: rgba(255, 255, 255, 0.02);
        }

        .log-entry.success {
            border-left-color: #38ef7d;
        }

        .log-entry.warning {
            border-left-color: #ffd700;
        }

        .log-entry.error {
            border-left-color: #f45c43;
        }

        /* 游戏场景模拟 */
        .game-scene {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }

        .game-scene h3 {
            margin-bottom: 10px;
            color: #87ceeb;
        }

        .scene-info {
            font-size: 0.9em;
            line-height: 1.5;
        }

        .scene-info span {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 5px;
        }

        /* 天气特效容器 */
        .weather-effects-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* 彩虹容器基础 */
        .rainbow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 彩虹光漏 - v5.3优化：更透亮，更少模糊 */
        .rainbow-light-leak {
            position: absolute;
            border-radius: 50%;
            filter: blur(var(--blur, 15px));  /* 减少模糊，从30px降到15px */
            mix-blend-mode: screen;
            pointer-events: none;
            opacity: 0;
            animation: fade-in 1.5s ease-out forwards;  /* 更快的渐现 */
        }

        /* 渐现动画 - 更快更亮 */
        @keyframes fade-in {
            0% {
                opacity: 0;
                filter: blur(calc(var(--blur, 15px) * 1.5));  /* 初始模糊更少 */
            }
            100% {
                opacity: 1;
                filter: blur(var(--blur, 15px));
            }
        }

        /* 梦幻漂浮动画 - 更柔和 */
        @keyframes dream-float {
            0%, 100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            25% {
                transform: translate(15px, -10px) scale(1.05) rotate(2deg);
            }
            50% {
                transform: translate(-10px, 15px) scale(0.98) rotate(-2deg);
            }
            75% {
                transform: translate(20px, 5px) scale(1.02) rotate(1deg);
            }
        }

        /* 轻柔漂移 */
        @keyframes gentle-drift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-10px, 10px) scale(1.03);
            }
        }

        /* 星光效果 */
        .rainbow-sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            opacity: 0;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 0.8;
                transform: scale(1);
            }
        }

        /* 超级柔和的出现动画 */
        @keyframes rainbow-ultra-soft-appear {
            0% {
                opacity: 0;
                filter: brightness(1.5);  /* 不要太亮 */
            }
            100% {
                opacity: 1;
                filter: brightness(1);
            }
        }

        /* 更自然的消散动画 - 随机性更强 */
        @keyframes rainbow-disperse-soft-1 {
            0% {
                opacity: var(--base-opacity, 0.7);
                transform: translate(0, 0) scale(1);
                filter: blur(var(--blur, 15px));
            }
            40% {
                opacity: calc(var(--base-opacity, 0.7) * 0.6);
                transform: translate(-30px, -20px) scale(1.2);
                filter: blur(calc(var(--blur, 15px) * 1.5));
            }
            100% {
                opacity: 0;
                transform: translate(-80px, -50px) scale(1.5) rotate(8deg);
                filter: blur(calc(var(--blur, 15px) * 2.5));
            }
        }

        @keyframes rainbow-disperse-soft-2 {
            0% {
                opacity: var(--base-opacity, 0.7);
                transform: translate(0, 0) scale(1);
                filter: blur(var(--blur, 18px));
            }
            50% {
                opacity: calc(var(--base-opacity, 0.7) * 0.5);
                transform: translate(25px, -35px) scale(1.3);
                filter: blur(calc(var(--blur, 18px) * 1.8));
            }
            100% {
                opacity: 0;
                transform: translate(60px, -80px) scale(1.6) rotate(-10deg);
                filter: blur(calc(var(--blur, 18px) * 3));
            }
        }

        @keyframes rainbow-disperse-soft-3 {
            0% {
                opacity: var(--base-opacity, 0.6);
                transform: translate(0, 0) scale(1);
                filter: blur(var(--blur, 20px));
            }
            30% {
                opacity: calc(var(--base-opacity, 0.6) * 0.7);
                transform: translate(15px, 25px) scale(1.1);
                filter: blur(calc(var(--blur, 20px) * 1.3));
            }
            100% {
                opacity: 0;
                transform: translate(50px, 70px) scale(1.4) rotate(6deg);
                filter: blur(calc(var(--blur, 20px) * 2));
            }
        }

        /* 雨滴效果 */
        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(174, 194, 224, 0.6) 50%,
                rgba(174, 194, 224, 0) 100%
            );
            animation: rain-fall linear infinite;
        }

        @keyframes rain-fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* 提示信息 */
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            font-size: 1.1em;
            text-align: center;
            z-index: 10001;
            display: none;
        }

        .hint.show {
            display: block;
            animation: hint-pulse 2s ease-in-out infinite;
        }

        @keyframes hint-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }
    </style>
</head>
<body>
    <!-- 天气特效容器 -->
    <div class="weather-effects-container" id="weatherEffects"></div>

    <!-- 游戏场景信息 -->
    <div class="game-scene">
        <h3>🎮 场景信息</h3>
        <div class="scene-info">
            <span>📍 <span id="location">公园</span></span>
            <span>🌤️ <span id="weather">晴天</span></span>
            <span>🕐 <span id="time">14:30</span></span>
            <span>🌡️ <span id="temp">22°C</span></span>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <h2>🌈 彩虹系统控制台 v5.3</h2>

        <!-- 天气控制 -->
        <div class="control-section">
            <h3>☁️ 天气控制</h3>
            <div class="button-group">
                <button onclick="setWeather('sunny')">☀️ 晴天</button>
                <button onclick="setWeather('rainy')">🌧️ 雨天</button>
                <button onclick="setWeather('cloudy')">☁️ 多云</button>
                <button onclick="setWeather('stormy')">⛈️ 暴雨</button>
            </div>
        </div>

        <!-- 场景控制 -->
        <div class="control-section">
            <h3>📍 场景切换</h3>
            <div class="button-group">
                <button onclick="setLocation('park')">🌳 公园(室外)</button>
                <button onclick="setLocation('street')">🏙️ 街道(室外)</button>
                <button onclick="setLocation('home')">🏠 家里(室内)</button>
                <button onclick="setLocation('mall')">🏬 商场(室内)</button>
            </div>
        </div>

        <!-- 彩虹控制 -->
        <div class="control-section">
            <h3>🌈 彩虹控制</h3>
            <div class="button-group single">
                <button onclick="testAutoTrigger()" class="success">✨ 测试自动触发流程</button>
                <button onclick="forceShowRainbow()">🌈 强制显示彩虹</button>
                <button onclick="forceEndRainbow()" class="danger">❌ 强制结束彩虹</button>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="control-section">
            <h3>📊 系统状态</h3>
            <div class="status-display">
                <div class="status-item">
                    <span class="status-label">彩虹版本</span>
                    <span class="status-value warning" id="rainbowVersion">v5.3 透亮优化版</span>
                </div>
                <div class="status-item">
                    <span class="status-label">彩虹状态</span>
                    <span class="status-value" id="rainbowStatus">未显示</span>
                </div>
                <div class="status-item">
                    <span class="status-label">当前位置</span>
                    <span class="status-value" id="currentLocation">公园(室外)</span>
                </div>
                <div class="status-item">
                    <span class="status-label">上次天气</span>
                    <span class="status-value" id="lastWeather">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">触发条件</span>
                    <span class="status-value" id="triggerStatus">未满足</span>
                </div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="control-section">
            <h3>📝 系统日志</h3>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <!-- 提示信息 -->
    <div class="hint" id="hint"></div>

    <script>
        // 模拟游戏状态
        let gameState = {
            weather: 'sunny',
            previousWeather: null,
            location: 'park',
            isOutdoor: true,
            time: '14:30',
            temperature: 22
        };

        // 彩虹管理器
        class RainbowManager {
            constructor() {
                this.isActive = false;
                this.container = null;
                this.duration = 15000; // 15秒
                this.endTimer = null;
                this.init();
            }

            init() {
                this.log('彩虹管理器 v5.3 初始化完成', 'success');
                this.log('✨ 优化：更透亮的光漏、更柔和的消散', 'success');
                this.updateStatus();
            }

            checkTriggerConditions() {
                // 检查触发条件
                const conditions = {
                    wasRainy: gameState.previousWeather === 'rainy' || gameState.previousWeather === 'stormy',
                    isSunny: gameState.weather === 'sunny',
                    isOutdoor: gameState.isOutdoor
                };

                const shouldTrigger = conditions.wasRainy && conditions.isSunny && conditions.isOutdoor;

                this.log(`条件检查: 之前雨天=${conditions.wasRainy}, 现在晴天=${conditions.isSunny}, 室外=${conditions.isOutdoor}`,
                    shouldTrigger ? 'success' : 'warning');

                document.getElementById('triggerStatus').textContent = shouldTrigger ? '✅ 满足' : '❌ 未满足';
                document.getElementById('triggerStatus').className = shouldTrigger ? 'status-value positive' : 'status-value negative';

                return shouldTrigger;
            }

            startRainbow() {
                if (this.isActive) {
                    this.log('彩虹已在显示中', 'warning');
                    return;
                }

                this.log('🌈 开始显示彩虹 (v5.3 透亮版)', 'success');
                this.isActive = true;

                // 创建彩虹容器 - 使用更快的渐现
                this.container = document.createElement('div');
                this.container.className = 'rainbow-container';
                this.container.style.animation = 'rainbow-ultra-soft-appear 3s ease-out forwards';

                // 创建多个光漏 - 更高的透明度，更少的模糊
                const lightLeaks = [
                    // 红橙色光漏 - 最亮
                    {
                        top: '10%', left: '15%', width: '30%', height: '35%',
                        color1: '255, 150, 100', color2: '255, 200, 120',
                        blur: 12, opacity: 0.8,  // 更高透明度，更少模糊
                        animation: 'dream-float 12s ease-in-out infinite',
                        delay: 0
                    },
                    // 金黄色光漏
                    {
                        top: '5%', left: '40%', width: '35%', height: '30%',
                        color1: '255, 230, 150', color2: '255, 255, 200',
                        blur: 15, opacity: 0.75,
                        animation: 'dream-float 14s ease-in-out infinite 1s',
                        delay: 300
                    },
                    // 绿色光漏
                    {
                        top: '12%', right: '20%', width: '32%', height: '38%',
                        color1: '150, 255, 180', color2: '200, 255, 220',
                        blur: 18, opacity: 0.7,
                        animation: 'gentle-drift 10s ease-in-out infinite',
                        delay: 600
                    },
                    // 蓝色光漏
                    {
                        top: '20%', left: '30%', width: '40%', height: '30%',
                        color1: '180, 200, 255', color2: '220, 180, 255',
                        blur: 20, opacity: 0.65,
                        animation: 'dream-float 15s ease-in-out infinite 2s',
                        delay: 900
                    },
                    // 紫色光漏
                    {
                        bottom: '30%', right: '25%', width: '25%', height: '30%',
                        color1: '220, 180, 255', color2: '255, 180, 220',
                        blur: 22, opacity: 0.6,
                        animation: 'gentle-drift 11s ease-in-out infinite 1s',
                        delay: 1200
                    }
                ];

                lightLeaks.forEach((leak, index) => {
                    setTimeout(() => {
                        const element = document.createElement('div');
                        element.className = 'rainbow-light-leak';
                        element.style.top = leak.top;
                        element.style.left = leak.left;
                        element.style.right = leak.right;
                        element.style.bottom = leak.bottom;
                        element.style.width = leak.width;
                        element.style.height = leak.height;

                        // 使用更简单的渐变，更透亮
                        element.style.background = `radial-gradient(
                            ellipse at center,
                            rgba(${leak.color1}, ${leak.opacity}) 0%,
                            rgba(${leak.color2}, ${leak.opacity * 0.6}) 50%,
                            transparent 80%
                        )`;

                        element.style.setProperty('--blur', `${leak.blur}px`);
                        element.style.setProperty('--base-opacity', leak.opacity);

                        // 渐现后添加漂浮动画
                        setTimeout(() => {
                            element.style.animation = `fade-in 1.5s ease-out forwards, ${leak.animation}`;
                        }, 100);

                        this.container.appendChild(element);
                        this.log(`光漏 ${index + 1} 出现 (透明度 ${leak.opacity})`);
                    }, leak.delay);
                });

                // 星光点缀 - 更少更亮
                setTimeout(() => {
                    for (let i = 0; i < 5; i++) {  // 减少到5个
                        setTimeout(() => {
                            const sparkle = document.createElement('div');
                            sparkle.className = 'rainbow-sparkle';
                            sparkle.style.top = `${20 + Math.random() * 50}%`;
                            sparkle.style.left = `${15 + Math.random() * 70}%`;
                            sparkle.style.animationDelay = `${Math.random() * 2}s`;
                            this.container.appendChild(sparkle);
                        }, i * 300);
                    }
                    this.log('✨ 星光点缀完成');
                }, 2000);

                // 添加到页面
                document.getElementById('weatherEffects').appendChild(this.container);

                // 更新状态
                this.updateStatus();

                // 设置自动消失
                this.endTimer = setTimeout(() => {
                    this.endRainbow();
                }, this.duration);

                this.log(`彩虹将在 ${this.duration/1000} 秒后自动消散`, 'success');
            }

            endRainbow() {
                if (!this.isActive || !this.container) {
                    return;
                }

                this.log('🌈 开始柔和消散动画', 'success');

                // 清除定时器
                if (this.endTimer) {
                    clearTimeout(this.endTimer);
                    this.endTimer = null;
                }

                // 获取所有彩虹元素
                const elements = this.container.children;

                // 使用更柔和的消散动画
                const disperseAnimations = [
                    'rainbow-disperse-soft-1',
                    'rainbow-disperse-soft-2',
                    'rainbow-disperse-soft-3'
                ];

                // 随机化消散顺序，更自然
                const indices = Array.from({length: elements.length}, (_, i) => i);
                indices.sort(() => Math.random() - 0.5);

                indices.forEach((originalIndex, orderIndex) => {
                    const element = elements[originalIndex];
                    if (element.className === 'rainbow-light-leak') {
                        const animationName = disperseAnimations[orderIndex % 3];
                        const duration = 2.5 + Math.random() * 1.5;  // 2.5-4秒随机
                        const delay = orderIndex * 0.3;  // 错开消散

                        setTimeout(() => {
                            element.style.animation = `${animationName} ${duration}s ease-out forwards`;
                            this.log(`光漏消散: ${duration.toFixed(1)}秒`);
                        }, delay * 1000);

                    } else if (element.className === 'rainbow-sparkle') {
                        // 星光先消失
                        element.style.opacity = '0';
                        element.style.transition = 'opacity 0.3s';
                    }
                });

                // 等待动画完成后移除
                setTimeout(() => {
                    if (this.container) {
                        this.container.remove();
                        this.container = null;
                    }
                    this.isActive = false;
                    this.updateStatus();
                    this.log('彩虹完全消失', 'success');
                }, 5000);
            }

            onWeatherChange(newWeather) {
                this.log(`天气变化: ${gameState.weather} → ${newWeather}`);

                gameState.previousWeather = gameState.weather;
                gameState.weather = newWeather;

                // 更新显示
                document.getElementById('weather').textContent = this.getWeatherName(newWeather);
                document.getElementById('lastWeather').textContent = this.getWeatherName(gameState.previousWeather);

                // 检查是否应该触发彩虹
                if (this.checkTriggerConditions()) {
                    // 模拟概率触发（30%概率）
                    const chance = Math.random();
                    if (chance < 0.3) {
                        this.log('🎲 概率检查通过 (30%)', 'success');
                        setTimeout(() => {
                            this.startRainbow();
                        }, 2500); // 2.5秒延迟
                    } else {
                        this.log(`🎲 概率检查未通过 (${(chance*100).toFixed(0)}%)`, 'warning');
                    }
                }
            }

            onLocationChange(newLocation, isOutdoor) {
                this.log(`场景切换: ${gameState.location} → ${newLocation}`);

                gameState.location = newLocation;
                gameState.isOutdoor = isOutdoor;

                // 更新显示
                document.getElementById('location').textContent = newLocation;
                document.getElementById('currentLocation').textContent = `${newLocation}(${isOutdoor ? '室外' : '室内'})`;

                // 如果进入室内，立即结束彩虹
                if (!isOutdoor && this.isActive) {
                    this.log('进入室内，彩虹消失', 'warning');
                    this.endRainbow();
                }
            }

            updateStatus() {
                const statusEl = document.getElementById('rainbowStatus');
                if (this.isActive) {
                    statusEl.textContent = '🌈 显示中';
                    statusEl.className = 'status-value positive';
                } else {
                    statusEl.textContent = '未显示';
                    statusEl.className = 'status-value';
                }
            }

            getWeatherName(weather) {
                const names = {
                    'sunny': '☀️ 晴天',
                    'cloudy': '☁️ 多云',
                    'rainy': '🌧️ 雨天',
                    'stormy': '⛈️ 暴雨'
                };
                return names[weather] || weather;
            }

            log(message, type = '') {
                const container = document.getElementById('logContainer');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                const time = new Date().toLocaleTimeString('zh-CN');
                entry.textContent = `[${time}] ${message}`;
                container.appendChild(entry);
                container.scrollTop = container.scrollHeight;

                console.log(`[RainbowManager] ${message}`);
            }
        }

        // 初始化彩虹管理器
        const rainbowManager = new RainbowManager();

        // 控制函数
        function setWeather(weather) {
            // 清除现有雨滴
            const effects = document.getElementById('weatherEffects');
            const raindrops = effects.querySelectorAll('.raindrop');
            raindrops.forEach(drop => drop.remove());

            // 如果是雨天，添加雨滴
            if (weather === 'rainy' || weather === 'stormy') {
                const dropCount = weather === 'stormy' ? 100 : 50;
                for (let i = 0; i < dropCount; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    drop.style.left = `${Math.random() * 100}%`;
                    drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                    drop.style.animationDelay = `${Math.random() * 2}s`;
                    effects.appendChild(drop);
                }
            }

            // 通知管理器
            rainbowManager.onWeatherChange(weather);
        }

        function setLocation(location) {
            const locations = {
                'park': { name: '公园', outdoor: true },
                'street': { name: '街道', outdoor: true },
                'home': { name: '家里', outdoor: false },
                'mall': { name: '商场', outdoor: false }
            };

            const loc = locations[location];
            if (loc) {
                rainbowManager.onLocationChange(loc.name, loc.outdoor);
            }
        }

        function testAutoTrigger() {
            showHint('开始自动触发测试流程...');

            // Step 1: 设置为雨天
            setTimeout(() => {
                showHint('Step 1: 设置雨天');
                setWeather('rainy');
            }, 1000);

            // Step 2: 确保在室外
            setTimeout(() => {
                showHint('Step 2: 移动到室外');
                setLocation('park');
            }, 3000);

            // Step 3: 天气转晴
            setTimeout(() => {
                showHint('Step 3: 雨过天晴，等待彩虹...');
                setWeather('sunny');
            }, 5000);

            // 隐藏提示
            setTimeout(() => {
                hideHint();
            }, 9000);
        }

        function forceShowRainbow() {
            rainbowManager.startRainbow();
        }

        function forceEndRainbow() {
            rainbowManager.endRainbow();
        }

        function showHint(text) {
            const hint = document.getElementById('hint');
            hint.textContent = text;
            hint.className = 'hint show';
        }

        function hideHint() {
            const hint = document.getElementById('hint');
            hint.className = 'hint';
        }

        // 更新时间显示
        setInterval(() => {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }, 1000);

        // 初始化
        window.addEventListener('load', () => {
            rainbowManager.log('页面加载完成', 'success');
            rainbowManager.log('v5.3 改进：', 'success');
            rainbowManager.log('1. 减少模糊度 (15-22px)', 'success');
            rainbowManager.log('2. 提高透明度 (0.6-0.8)', 'success');
            rainbowManager.log('3. 简化渐变结构', 'success');
            rainbowManager.log('4. 随机化消散顺序', 'success');
            rainbowManager.log('5. 更柔和的动画曲线', 'success');
        });
    </script>
</body>
</html>
