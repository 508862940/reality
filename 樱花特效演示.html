<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 樱花特效演示 - Reality游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #FFE5EC 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰 */
        .ground {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(to top, #228B22 0%, #32CD32 50%, transparent 100%);
            z-index: 1;
        }

        .house {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 100px;
            z-index: 2;
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 15px;
            z-index: 100;
            max-width: 350px;
        }

        .control-panel h2 {
            color: #FFB7C5;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .control-item {
            margin-bottom: 15px;
        }

        .control-item label {
            display: block;
            color: #ffd700;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .control-item input[type="range"] {
            width: 100%;
        }

        .control-value {
            color: #FFB7C5;
            font-weight: bold;
            float: right;
        }

        .btn {
            background: linear-gradient(135deg, #FFB7C5, #FF85A2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 183, 197, 0.5);
        }

        .btn-group {
            margin-top: 15px;
            text-align: center;
        }

        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 12px;
            color: #ccc;
        }

        /* ===== 樱花容器 ===== */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* ===== 樱花花瓣 ===== */
        .sakura-petal {
            position: absolute;
            width: 14px;
            height: 14px;
            will-change: transform;
            /* 发光效果在JS中动态设置 */
        }

        /* 花瓣形状：真实樱花单瓣（倒水滴形+顶端缺刻）*/
        .sakura-petal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 30%,
                var(--color1, #fd91b0) 0%,
                var(--color2, #ffadbe) 40%,
                var(--color3, #ffe5eb) 100%);
            /* 樱花瓣形状：上部椭圆+顶端V形缺口+下部收拢 */
            clip-path: polygon(
                50% 3%,        /* 顶端左侧缺口 */
                45% 0%,        /* 缺口凹陷 */
                50% 2%,        /* 缺口中心 */
                55% 0%,        /* 缺口凹陷 */
                50% 3%,        /* 顶端右侧缺口 */
                70% 15%,       /* 右上圆弧 */
                85% 35%,       /* 右侧最宽处 */
                80% 60%,       /* 右下收拢 */
                60% 85%,       /* 右底部 */
                50% 100%,      /* 底端尖 */
                40% 85%,       /* 左底部 */
                20% 60%,       /* 左下收拢 */
                15% 35%,       /* 左侧最宽处 */
                30% 15%        /* 左上圆弧 */
            );
            box-shadow: 0 1px 3px rgba(255, 183, 197, 0.2);
        }

        /* 花瓣纹理（中心到边缘的脉络）*/
        .sakura-petal::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 40%;
            width: 20%;
            height: 70%;
            background: linear-gradient(to bottom,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0.15) 40%,
                transparent 100%);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* 提示文字 */
        .tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 24px;
            text-align: center;
            z-index: 5;
            animation: fadeOut 3s forwards;
        }

        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }
    </style>
</head>
<body>
    <!-- 控制面板 -->
    <div class="control-panel">
        <h2>🌸 樱花特效控制器</h2>

        <div class="control-item">
            <label>
                花瓣数量: <span class="control-value" id="countValue">80</span>
            </label>
            <input type="range" id="count" min="20" max="200" value="80" oninput="updateCount()">
        </div>

        <div class="control-item">
            <label>
                最小尺寸: <span class="control-value" id="minSizeValue">6px</span>
            </label>
            <input type="range" id="minSize" min="4" max="15" value="6" oninput="restart()">
        </div>

        <div class="control-item">
            <label>
                最大尺寸: <span class="control-value" id="maxSizeValue">15px</span>
            </label>
            <input type="range" id="maxSize" min="10" max="30" value="15" oninput="restart()">
        </div>

        <div class="control-item">
            <label>
                模糊程度: <span class="control-value" id="blurValue">0.8px</span>
            </label>
            <input type="range" id="blur" min="0" max="20" value="8" oninput="restart()">
        </div>

        <div class="control-item">
            <label>
                下落速度: <span class="control-value" id="speedValue">正常</span>
            </label>
            <input type="range" id="speed" min="50" max="200" value="100" oninput="restart()">
        </div>

        <div class="btn-group">
            <button class="btn" onclick="restart()">🔄 重新生成</button>
            <button class="btn" onclick="clearPetals()">🗑️ 清空</button>
        </div>

        <div class="stats">
            <div>💗 粉色花瓣: 85%（更亮）</div>
            <div>🤍 白色花瓣: 15%（更小）</div>
            <div>📊 当前花瓣数: <span id="currentCount">0</span></div>
        </div>
    </div>

    <!-- 背景装饰 -->
    <div class="ground"></div>
    <div class="house">🏠</div>

    <!-- 樱花容器 -->
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- 提示 -->
    <div class="tip">🌸 樱花飘落中...</div>

    <script>
        // 配置
        const sakuraConfig = {
            // 提高明度（更亮更鲜艳）
            color1: '#ffaac8',  // 更亮的粉色
            color2: '#ffc2d6',  // 更亮的粉色
            color3: '#fff0f5',  // 接近白的淡粉
            color4: '#fff5f8',
            color5: '#ffe5ed',
            color6: '#ffd1e0'
        };

        const whiteConfig = {
            color1: '#ffffff',
            color2: '#fffbfc',
            color3: '#fff5f7',
            color4: '#ffffff',
            color5: '#fffdfe',
            color6: '#fffafc'
        };

        let petalElements = [];
        let animationFrame;

        // 花瓣类
        class SakuraPetal {
            constructor(container) {
                this.container = container;
                this.element = document.createElement('div');
                this.element.className = 'sakura-petal';

                // 随机属性
                this.reset();

                container.appendChild(this.element);
            }

            reset() {
                const minSize = parseInt(document.getElementById('minSize').value);
                const maxSize = parseInt(document.getElementById('maxSize').value);
                const blur = parseInt(document.getElementById('blur').value) / 10;
                const speedFactor = parseInt(document.getElementById('speed').value) / 100;

                // 位置
                this.x = Math.random() * window.innerWidth;
                this.y = -100 - Math.random() * 200; // 从屏幕上方开始

                // 颜色（15%白色，更少）
                this.isWhite = Math.random() < 0.15; // 保存为实例属性
                this.colors = this.isWhite ? whiteConfig : sakuraConfig;

                // 大小（白色花瓣更小）
                if (this.isWhite) {
                    // 白色花瓣：60%-80%的正常大小
                    this.size = (minSize + Math.random() * (maxSize - minSize)) * (0.6 + Math.random() * 0.2);
                } else {
                    // 粉色花瓣：正常大小
                    this.size = minSize + Math.random() * (maxSize - minSize);
                }

                // 速度（模拟真实樱花：5cm/s = 约0.05-0.15px/帧 @ 60fps）
                const sizeFactor = this.size / maxSize;
                this.speedY = (0.08 + sizeFactor * 0.12) / speedFactor; // 纵向：0.08-0.2px/帧
                this.speedX = (Math.random() - 0.5) * 0.1; // 横向微漂移

                // 摇摆（轻柔飘动）
                this.swingSpeed = 0.001 + Math.random() * 0.003; // 非常慢的摇摆
                this.swingDistance = 10 + Math.random() * 20;
                this.swingOffset = Math.random() * Math.PI * 2;

                // 旋转（缓慢翻转）
                this.rotationSpeed = (Math.random() - 0.5) * 0.3; // 很慢的旋转
                this.rotation = Math.random() * 360;

                // 透明度
                const baseOpacity = this.isWhite ? 0.7 : 0.8;
                this.opacity = baseOpacity + Math.random() * 0.15;

                // 模糊
                this.blur = blur * (0.8 + Math.random() * 0.4);

                this.updateStyle();
            }

            updateStyle() {
                const el = this.element;

                // 位置和变换
                const swingX = Math.sin(Date.now() * this.swingSpeed + this.swingOffset) * this.swingDistance;
                el.style.transform = `translate(${this.x + swingX}px, ${this.y}px) rotate(${this.rotation}deg)`;

                // 大小
                el.style.width = this.size + 'px';
                el.style.height = this.size + 'px';

                // 颜色
                el.style.setProperty('--color1', this.colors.color1);
                el.style.setProperty('--color2', this.colors.color2);
                el.style.setProperty('--color3', this.colors.color3);
                el.style.setProperty('--color4', this.colors.color4);
                el.style.setProperty('--color5', this.colors.color5);
                el.style.setProperty('--color6', this.colors.color6);

                // 透明度
                el.style.opacity = this.opacity;
                // 添加简单的发光效果
                el.style.filter = `blur(${this.blur}px)`;
                el.style.boxShadow = this.isWhite
                    ? '0 0 4px rgba(255, 255, 255, 0.5)'
                    : '0 0 6px rgba(255, 182, 193, 0.6)';
            }

            update() {
                // 移动
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;

                // 如果掉出屏幕，重置到顶部
                if (this.y > window.innerHeight + 100) {
                    this.y = -100;
                    this.x = Math.random() * window.innerWidth;
                }

                // 边界检查
                if (this.x < -50) this.x = window.innerWidth + 50;
                if (this.x > window.innerWidth + 50) this.x = -50;

                this.updateStyle();
            }

            remove() {
                this.element.remove();
            }
        }

        // 动画循环
        function animate() {
            petalElements.forEach(petal => petal.update());
            animationFrame = requestAnimationFrame(animate);
        }

        // 创建樱花
        function createSakura() {
            const container = document.getElementById('sakuraContainer');
            const count = parseInt(document.getElementById('count').value);

            // 创建花瓣
            petalElements = [];
            for (let i = 0; i < count; i++) {
                petalElements.push(new SakuraPetal(container));
            }

            document.getElementById('currentCount').textContent = count;

            // 开始动画
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animate();
        }

        // 清空花瓣
        function clearPetals() {
            petalElements.forEach(petal => petal.remove());
            petalElements = [];
            if (animationFrame) cancelAnimationFrame(animationFrame);
            document.getElementById('currentCount').textContent = '0';
        }

        // 更新数量
        function updateCount() {
            document.getElementById('countValue').textContent = document.getElementById('count').value;
        }

        // 重新生成
        function restart() {
            // 更新显示值
            document.getElementById('minSizeValue').textContent = document.getElementById('minSize').value + 'px';
            document.getElementById('maxSizeValue').textContent = document.getElementById('maxSize').value + 'px';
            document.getElementById('blurValue').textContent = (document.getElementById('blur').value / 10) + 'px';

            const speed = document.getElementById('speed').value;
            const speedText = speed < 80 ? '慢速' : speed > 120 ? '快速' : '正常';
            document.getElementById('speedValue').textContent = speedText;

            clearPetals();
            createSakura();
        }

        // 初始化
        window.addEventListener('load', () => {
            createSakura();
        });

        // 窗口大小改变时调整
        window.addEventListener('resize', () => {
            // 花瓣会自动适应，不需要重新生成
        });
    </script>
</body>
</html>
