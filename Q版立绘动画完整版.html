<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q版立绘动画系统 - 完整可用版</title>
    <style>
        :root {
            --primary-color: #8b5cf6;
            --bg-dark: #1a1a2e;
            --bg-light: #2d2d44;
            --text-light: #e4e4e7;
            --accent-pink: #f093fb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary-color);
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
            margin-bottom: 10px;
        }

        /* 图片上传区域 */
        .upload-section {
            max-width: 1200px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 30px;
        }

        .upload-title {
            color: var(--accent-pink);
            margin-bottom: 20px;
            text-align: center;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .upload-slot {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-slot:hover {
            border-color: var(--primary-color);
            background: rgba(139, 92, 246, 0.1);
        }

        .upload-slot.loaded {
            border-color: var(--accent-pink);
            background: rgba(240, 147, 251, 0.1);
        }

        .upload-slot img {
            max-width: 80px;
            max-height: 120px;
            image-rendering: pixelated;
            margin-bottom: 10px;
        }

        .upload-slot input[type="file"] {
            display: none;
        }

        .slot-label {
            font-size: 12px;
            color: #a1a1aa;
            margin-bottom: 5px;
        }

        .slot-name {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .upload-placeholder {
            width: 60px;
            height: 60px;
            border: 2px dashed #666;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 24px;
            color: #666;
        }

        .quick-load-btn {
            display: block;
            margin: 20px auto;
            background: linear-gradient(135deg, #8b5cf6, #f093fb);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .quick-load-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        /* 主展示区 */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: none;
        }

        .main-container.active {
            display: block;
        }

        /* A区立绘展示 */
        .portrait-stage {
            background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(139,92,246,0.1));
            border-radius: 20px;
            padding: 60px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
        }

        .chibi-sprite {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 10px 30px rgba(139, 92, 246, 0.5));
            transition: all 0.3s;
        }

        /* 不同尺寸 */
        .size-small .chibi-sprite { width: 64px; height: 128px; }
        .size-medium .chibi-sprite { width: 128px; height: 256px; }
        .size-large .chibi-sprite { width: 192px; height: 384px; }
        .size-xlarge .chibi-sprite { width: 256px; height: 512px; }

        /* 控制面板 */
        .control-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .control-section {
            margin-bottom: 25px;
        }

        .control-title {
            color: var(--accent-pink);
            font-size: 18px;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #8b5cf6, #f093fb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        button.active {
            background: linear-gradient(135deg, #f093fb, #8b5cf6);
        }

        /* 滑块 */
        .slider-control {
            margin-top: 15px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .slider-value {
            color: var(--primary-color);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: linear-gradient(to right, rgba(139, 92, 246, 0.3), rgba(240, 147, 251, 0.3));
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #8b5cf6, #f093fb);
            border-radius: 50%;
            cursor: pointer;
        }

        /* 动画效果 */
        @keyframes breathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.03) scaleX(0.97); }
        }

        .breathing {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating {
            animation: float 2s ease-in-out infinite;
        }

        /* 提示框 */
        .info-box {
            background: rgba(139, 92, 246, 0.1);
            border-left: 4px solid var(--primary-color);
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .info-title {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Q版立绘动画系统</h1>
        <p>请上传你的7张像素画图片来查看动画效果</p>
    </div>

    <!-- 图片上传区域 -->
    <div class="upload-section" id="uploadSection">
        <h2 class="upload-title">📁 上传动画帧（点击各个框上传对应图片）</h2>

        <div class="upload-grid">
            <!-- 眨眼动画帧 -->
            <div class="upload-slot" onclick="selectFile(0)">
                <input type="file" id="file0" accept="image/*" onchange="loadImage(0, this)">
                <div class="upload-placeholder" id="preview0">+</div>
                <div class="slot-label">眨眼动画 - 帧1</div>
                <div class="slot-name">标准小人2</div>
            </div>

            <div class="upload-slot" onclick="selectFile(1)">
                <input type="file" id="file1" accept="image/*" onchange="loadImage(1, this)">
                <div class="upload-placeholder" id="preview1">+</div>
                <div class="slot-label">眨眼动画 - 帧2</div>
                <div class="slot-name">眨眼1</div>
            </div>

            <div class="upload-slot" onclick="selectFile(2)">
                <input type="file" id="file2" accept="image/*" onchange="loadImage(2, this)">
                <div class="upload-placeholder" id="preview2">+</div>
                <div class="slot-label">眨眼动画 - 帧3</div>
                <div class="slot-name">眨眼2</div>
            </div>

            <div class="upload-slot" onclick="selectFile(3)">
                <input type="file" id="file3" accept="image/*" onchange="loadImage(3, this)">
                <div class="upload-placeholder" id="preview3">+</div>
                <div class="slot-label">眨眼动画 - 帧4</div>
                <div class="slot-name">眨眼3</div>
            </div>

            <!-- 行走动画帧 -->
            <div class="upload-slot" onclick="selectFile(4)">
                <input type="file" id="file4" accept="image/*" onchange="loadImage(4, this)">
                <div class="upload-placeholder" id="preview4">+</div>
                <div class="slot-label">行走动画 - 帧1</div>
                <div class="slot-name">行走1</div>
            </div>

            <div class="upload-slot" onclick="selectFile(5)">
                <input type="file" id="file5" accept="image/*" onchange="loadImage(5, this)">
                <div class="upload-placeholder" id="preview5">+</div>
                <div class="slot-label">行走动画 - 帧2</div>
                <div class="slot-name">标准小人1</div>
            </div>

            <div class="upload-slot" onclick="selectFile(6)">
                <input type="file" id="file6" accept="image/*" onchange="loadImage(6, this)">
                <div class="upload-placeholder" id="preview6">+</div>
                <div class="slot-label">行走动画 - 帧3</div>
                <div class="slot-name">行走2</div>
            </div>
        </div>

        <button class="quick-load-btn" onclick="startAnimation()">
            🎮 开始预览动画
        </button>
    </div>

    <!-- 主展示区（初始隐藏） -->
    <div class="main-container" id="mainContainer">
        <div class="portrait-stage size-medium" id="portraitStage">
            <div id="chibiContainer">
                <img class="chibi-sprite" id="mainSprite" alt="Q版立绘">
            </div>
        </div>

        <div class="control-panel">
            <!-- 眨眼控制 -->
            <div class="control-section">
                <h3 class="control-title">👁️ 眨眼动画</h3>
                <div class="button-group">
                    <button onclick="toggleBlink()" id="blinkBtn">▶️ 开始眨眼</button>
                    <button onclick="blinkOnce()">眨眼一次</button>
                </div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>眨眼间隔</span>
                        <span class="slider-value" id="blinkIntervalValue">3秒</span>
                    </div>
                    <input type="range" min="1" max="10" value="3" step="0.5"
                           oninput="updateBlinkInterval(this.value)">
                </div>
            </div>

            <!-- 行走控制 -->
            <div class="control-section">
                <h3 class="control-title">🚶 行走动画</h3>
                <div class="button-group">
                    <button onclick="toggleWalk()" id="walkBtn">▶️ 开始行走</button>
                    <button onclick="toggleEffect('breathing')">呼吸效果</button>
                    <button onclick="toggleEffect('floating')">飘浮效果</button>
                </div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>行走速度</span>
                        <span class="slider-value" id="walkSpeedValue">300ms</span>
                    </div>
                    <input type="range" min="100" max="1000" value="300" step="50"
                           oninput="updateWalkSpeed(this.value)">
                </div>
            </div>

            <!-- 显示大小 -->
            <div class="control-section">
                <h3 class="control-title">🎨 显示设置</h3>
                <div class="button-group">
                    <button onclick="setSize('small')">小 (64px)</button>
                    <button onclick="setSize('medium')" class="active">中 (128px)</button>
                    <button onclick="setSize('large')">大 (192px)</button>
                    <button onclick="setSize('xlarge')">超大 (256px)</button>
                </div>
            </div>
        </div>

        <div class="info-box">
            <div class="info-title">💡 快捷键</div>
            <div>
                • 空格键 - 播放/暂停眨眼<br>
                • W键 - 播放/暂停行走<br>
                • B键 - 眨眼一次<br>
                • Tab键 - 切换大小
            </div>
        </div>
    </div>

    <script>
        // 存储所有帧的图片数据
        const frames = {
            blink: [null, null, null, null],
            walk: [null, null, null]
        };

        // 动画控制器
        let blinkTimer = null;
        let blinkInterval = null;
        let walkTimer = null;
        let isBlinking = false;
        let isWalking = false;
        let blinkIntervalTime = 3000;
        let walkSpeed = 300;
        let currentBlinkFrame = 0;
        let currentWalkFrame = 0;

        // 选择文件
        function selectFile(index) {
            document.getElementById(`file${index}`).click();
        }

        // 加载图片
        function loadImage(index, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    // 保存图片数据
                    if (index < 4) {
                        frames.blink[index] = e.target.result;
                    } else {
                        frames.walk[index - 4] = e.target.result;
                    }

                    // 更新预览
                    const preview = document.getElementById(`preview${index}`);
                    preview.innerHTML = `<img src="${e.target.result}" alt="帧${index + 1}">`;
                    preview.parentElement.classList.add('loaded');

                    // 检查是否所有图片都已加载
                    checkAllLoaded();
                };

                reader.readAsDataURL(input.files[0]);
            }
        }

        // 检查是否所有图片都已加载
        function checkAllLoaded() {
            const allLoaded = frames.blink.every(f => f !== null) &&
                            frames.walk.every(f => f !== null);

            if (allLoaded) {
                document.querySelector('.quick-load-btn').style.background =
                    'linear-gradient(135deg, #10b981, #3b82f6)';
            }
        }

        // 开始动画预览
        function startAnimation() {
            // 检查是否有图片
            if (!frames.blink[0] && !frames.walk[0]) {
                alert('请至少上传一张图片！');
                return;
            }

            // 显示主界面
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('mainContainer').classList.add('active');

            // 设置初始图片
            const sprite = document.getElementById('mainSprite');
            sprite.src = frames.blink[0] || frames.walk[0] || '';
        }

        // 眨眼动画
        function toggleBlink() {
            if (isBlinking) {
                stopBlink();
            } else {
                startBlink();
            }
        }

        function startBlink() {
            if (!frames.blink[0]) return;

            isBlinking = true;
            document.getElementById('blinkBtn').textContent = '⏸ 停止眨眼';

            // 立即执行一次
            playBlinkAnimation();

            // 设置间隔
            blinkInterval = setInterval(playBlinkAnimation, blinkIntervalTime);
        }

        function stopBlink() {
            isBlinking = false;
            document.getElementById('blinkBtn').textContent = '▶️ 开始眨眼';

            clearInterval(blinkInterval);
            clearTimeout(blinkTimer);

            // 恢复到第一帧
            if (!isWalking && frames.blink[0]) {
                document.getElementById('mainSprite').src = frames.blink[0];
            }
        }

        function playBlinkAnimation() {
            if (!frames.blink[0]) return;

            let frame = 0;
            const sprite = document.getElementById('mainSprite');

            function nextFrame() {
                if (frame >= 4 || !frames.blink[frame]) {
                    // 动画结束，恢复到第一帧
                    if (!isWalking) {
                        sprite.src = frames.blink[0];
                    }
                    return;
                }

                // 显示当前帧
                sprite.src = frames.blink[frame];

                // 计算延迟（眨眼后半段更快）
                let delay = frame < 2 ? 150 : 100;

                frame++;
                blinkTimer = setTimeout(nextFrame, delay);
            }

            nextFrame();
        }

        function blinkOnce() {
            if (!frames.blink[0]) return;

            // 如果正在自动眨眼，先停止
            if (isBlinking) {
                stopBlink();
            }

            playBlinkAnimation();
        }

        // 行走动画
        function toggleWalk() {
            if (isWalking) {
                stopWalk();
            } else {
                startWalk();
            }
        }

        function startWalk() {
            if (!frames.walk[0]) return;

            isWalking = true;
            document.getElementById('walkBtn').textContent = '⏸ 停止行走';

            function animate() {
                if (!isWalking) return;

                // 如果没有正在眨眼，才更新行走帧
                if (!blinkTimer) {
                    const sprite = document.getElementById('mainSprite');
                    if (frames.walk[currentWalkFrame]) {
                        sprite.src = frames.walk[currentWalkFrame];
                    }
                }

                currentWalkFrame = (currentWalkFrame + 1) % 3;
                walkTimer = setTimeout(animate, walkSpeed);
            }

            animate();
        }

        function stopWalk() {
            isWalking = false;
            document.getElementById('walkBtn').textContent = '▶️ 开始行走';

            clearTimeout(walkTimer);
            currentWalkFrame = 0;

            // 恢复到静止帧
            if (!isBlinking && frames.blink[0]) {
                document.getElementById('mainSprite').src = frames.blink[0];
            }
        }

        // 更新参数
        function updateBlinkInterval(value) {
            blinkIntervalTime = value * 1000;
            document.getElementById('blinkIntervalValue').textContent = `${value}秒`;

            if (isBlinking) {
                stopBlink();
                startBlink();
            }
        }

        function updateWalkSpeed(value) {
            walkSpeed = parseInt(value);
            document.getElementById('walkSpeedValue').textContent = `${value}ms`;

            if (isWalking) {
                stopWalk();
                startWalk();
            }
        }

        // 切换效果
        function toggleEffect(effect) {
            const container = document.getElementById('chibiContainer');
            container.classList.toggle(effect);
        }

        // 设置大小
        function setSize(size) {
            const stage = document.getElementById('portraitStage');
            stage.className = `portrait-stage size-${size}`;

            // 更新按钮状态
            document.querySelectorAll('.control-section button').forEach(btn => {
                if (btn.textContent.includes('px')) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case ' ':
                    e.preventDefault();
                    toggleBlink();
                    break;
                case 'w':
                    toggleWalk();
                    break;
                case 'b':
                    blinkOnce();
                    break;
                case 'tab':
                    e.preventDefault();
                    const sizes = ['small', 'medium', 'large', 'xlarge'];
                    const stage = document.getElementById('portraitStage');
                    const current = sizes.find(s => stage.classList.contains(`size-${s}`)) || 'medium';
                    const next = sizes[(sizes.indexOf(current) + 1) % sizes.length];
                    stage.className = `portrait-stage size-${next}`;
                    break;
            }
        });

        console.log('✨ Q版立绘动画系统已准备就绪！');
        console.log('📝 请上传你的7张像素画图片来查看动画效果');
    </script>
</body>
</html>
