<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 条件系统测试 - Stage 4</title>

    <!-- 游戏样式 -->
    <link rel="stylesheet" href="css/game-main.css">

    <style>
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #fff;
            padding: 20px;
        }

        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .test-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .test-header h1 {
            font-size: 28px;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .test-panels {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
            height: calc(100vh - 250px);  /* 自适应高度 */
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            height: 100%;  /* 填满父容器 */
            overflow-y: auto;
        }

        /* 左侧面板滚动条美化 */
        .control-panel::-webkit-scrollbar {
            width: 6px;
        }

        .control-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 3px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: rgba(240, 147, 251, 0.3);
            border-radius: 3px;
        }

        .control-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(240, 147, 251, 0.5);
        }

        .control-panel h2 {
            font-size: 18px;
            margin: 0 0 15px;
            color: #f093fb;
        }

        .preset-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preset-btn {
            padding: 10px 15px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .preset-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateX(3px);
        }

        .preset-btn.active {
            background: rgba(139, 92, 246, 0.5);
        }

        .scene-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            padding-bottom: 40px;  /* 底部额外空间，确保最后一个选项可见 */
            border-radius: 15px;
            backdrop-filter: blur(10px);
            height: 100%;  /* 填满父容器 */
            overflow-y: auto;
            overflow-x: hidden;
            /* 防止滚动反弹 */
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* 美化滚动条 */
        .scene-container::-webkit-scrollbar {
            width: 8px;
        }

        .scene-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .scene-container::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }

        .scene-container::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        .state-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .state-display h3 {
            margin: 0 0 10px;
            color: #fbbf24;
            font-size: 14px;
        }

        .state-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .state-label {
            color: #94a3b8;
        }

        .state-value {
            color: #f0abfc;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .info-box {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .info-box h3 {
            margin: 0 0 10px;
            color: #fbbf24;
            font-size: 16px;
        }

        .info-box ul {
            margin: 0;
            padding-left: 20px;
            line-height: 1.8;
        }

        /* 场景样式覆盖 */
        #storyArea {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            padding-bottom: 60px;  /* 底部额外空间 */
            border-radius: 10px;
            min-height: 300px;
        }

        .story-choice {
            background: rgba(139, 92, 246, 0.1);
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            display: block;
        }

        .story-choice:hover:not(.disabled) {
            background: rgba(139, 92, 246, 0.2);
            transform: translateX(5px);
        }

        .story-choice.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(75, 85, 99, 0.2);
            border-color: rgba(75, 85, 99, 0.3);
        }

        .story-choice.disabled:hover {
            transform: none;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🧪 条件系统测试 - Stage 4</h1>
            <p>测试场景条件检查、选项灰化、提示功能</p>
        </div>

        <div class="test-panels">
            <!-- 控制面板 -->
            <div class="control-panel">
                <h2>🎮 测试控制</h2>

                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setPreset('reset')">🔄 重置到默认</button>
                    <button class="preset-btn" onclick="scrollToBottom()">⬇️ 滚动到底</button>
                    <button class="preset-btn" onclick="setPreset('rich')">💰 金钱+100</button>
                    <button class="preset-btn" onclick="setPreset('poor')">💸 金钱=10</button>
                    <button class="preset-btn" onclick="setPreset('has_key')">🔑 获得钥匙</button>
                    <button class="preset-btn" onclick="setPreset('daytime')">☀️ 设为白天</button>
                    <button class="preset-btn" onclick="setPreset('nighttime')">🌙 设为夜晚</button>
                    <button class="preset-btn" onclick="setPreset('rainy')">🌧️ 设为雨天</button>
                    <button class="preset-btn" onclick="setPreset('sunny')">☀️ 设为晴天</button>
                    <button class="preset-btn" onclick="setPreset('winter')">❄️ 设为冬天</button>
                    <button class="preset-btn" onclick="setPreset('summer')">☀️ 设为夏天</button>
                    <button class="preset-btn" onclick="setPreset('strong')">💪 力量+15</button>
                    <button class="preset-btn" onclick="setPreset('weak')">💤 力量=5</button>
                    <button class="preset-btn" onclick="setPreset('high_energy')">⚡ 体力=80</button>
                    <button class="preset-btn" onclick="setPreset('low_energy')">😴 体力=20</button>
                    <button class="preset-btn" onclick="setPreset('park')">📍 移动到公园</button>
                    <button class="preset-btn" onclick="setPreset('home')">🏠 移动到家</button>
                    <button class="preset-btn" onclick="setPreset('zero_friend')">❤️ Zero好感60</button>
                </div>

                <div class="state-display">
                    <h3>📊 当前状态</h3>
                    <div id="currentState">
                        <div class="state-item">
                            <span class="state-label">金钱:</span>
                            <span class="state-value" id="stateMoney">30</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">体力:</span>
                            <span class="state-value" id="stateEnergy">50</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">时间:</span>
                            <span class="state-value" id="stateTime">--:--</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">天气:</span>
                            <span class="state-value" id="stateWeather">晴天</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">季节:</span>
                            <span class="state-value" id="stateSeason">春天</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">位置:</span>
                            <span class="state-value" id="stateLocation">家</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">力量:</span>
                            <span class="state-value" id="stateStrength">8</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">钥匙:</span>
                            <span class="state-value" id="stateKey">无</span>
                        </div>
                        <div class="state-item">
                            <span class="state-label">Zero好感:</span>
                            <span class="state-value" id="stateZero">25</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 场景容器 -->
            <div class="scene-container">
                <div id="storyArea">
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" onclick="runTest()">🚀 启动测试场景</button>
            <button class="action-btn" onclick="checkOptions()">🔍 检查可用选项</button>
            <button class="action-btn" onclick="reloadScene()">🔄 刷新场景</button>
            <button class="action-btn" onclick="showHelp()">❓ 显示帮助</button>
        </div>

        <div class="info-box">
            <h3>📝 测试说明</h3>
            <ul>
                <li>点击左侧预设按钮改变游戏状态</li>
                <li>观察右侧场景选项的可用性变化</li>
                <li>灰色选项表示条件不满足</li>
                <li>点击禁用选项会显示失败原因</li>
                <li>每个选项测试不同类型的条件</li>
            </ul>
        </div>
    </div>

    <!-- 游戏核心系统 -->
    <script src="js/core/world-state.js"></script>
    <script src="js/core/reactive-system.js"></script>
    <script src="js/core/time-system.js"></script>
    <script src="js/core/weather-system.js"></script>
    <script src="js/core/condition-engine.js"></script>
    <script src="js/core/random-engine.js"></script>
    <script src="js/core/scene-manager.js"></script>

    <!-- 测试场景 -->
    <script src="js/test/test-condition-scene.js"></script>

    <script>
        // 初始化系统
        function initSystems() {
            // 初始化世界状态
            window.worldState = new WorldState();
            // WorldState 构造函数中已经初始化，不需要调用 init

            // 初始化响应式系统
            window.reactiveSystem = new ReactiveSystem();

            // 初始化时间系统
            window.timeSystem = new TimeSystem();
            window.timeSystem.init();

            // 初始化天气系统
            window.weatherSystem = new WeatherSystem();
            window.weatherSystem.init();

            // 初始化场景管理器
            window.sceneManager = new SceneManager('storyArea');
            // SceneManager 构造函数中已经初始化基础功能

            console.log('✅ 所有系统初始化完成');

            // 更新显示
            updateStateDisplay();
        }

        // 设置预设
        function setPreset(preset) {
            TestConditionHelper.setTestState(preset);
            updateStateDisplay();

            // 重新加载场景以更新条件
            reloadScene();
        }

        // 更新状态显示
        function updateStateDisplay() {
            const state = window.worldState.state;

            // 使用 player.stats 而不是 character
            document.getElementById('stateMoney').textContent =
                (state.player && state.player.stats) ? state.player.stats.money : 30;
            document.getElementById('stateEnergy').textContent =
                (state.player && state.player.stats) ? state.player.stats.energy : 50;

            if (window.timeSystem && window.timeSystem.currentTime) {
                const time = window.timeSystem.currentTime;
                document.getElementById('stateTime').textContent =
                    `${String(time.hour).padStart(2, '0')}:${String(time.minute).padStart(2, '0')}`;
            }

            document.getElementById('stateWeather').textContent =
                state.environment.weather || '晴天';
            document.getElementById('stateSeason').textContent =
                state.environment.season || '春天';
            document.getElementById('stateLocation').textContent =
                (state.player && state.player.position) ? state.player.position.location : '家';

            // 使用 player.skills 或者单独的 attributes
            const strength = (state.player && state.player.attributes && state.player.attributes.strength) || 8;
            document.getElementById('stateStrength').textContent = strength;

            // 使用 player.inventory.items
            const hasKey = (state.player && state.player.inventory &&
                           state.player.inventory.items &&
                           state.player.inventory.items.find(item => item.name === '钥匙')) ? '有' : '无';
            document.getElementById('stateKey').textContent = hasKey;

            const zeroAffection = (state.relationships && state.relationships.zero)
                ? state.relationships.zero.affection : 25;
            document.getElementById('stateZero').textContent = zeroAffection;
        }

        // 运行测试
        function runTest() {
            TestConditionHelper.runTest();
            updateStateDisplay();
        }

        // 检查选项
        function checkOptions() {
            TestConditionHelper.checkAvailableOptions();
        }

        // 重新加载场景
        function reloadScene() {
            if (window.sceneManager && window.gameScenes) {
                const sceneData = window.gameScenes['test_condition_scene'];
                if (sceneData) {
                    window.sceneManager.loadScene(sceneData);
                }
            }
        }

        // 显示帮助
        function showHelp() {
            alert(`
条件系统测试说明：

1. 每个选项代表不同类型的条件检查
2. 使用左侧按钮改变游戏状态
3. 观察哪些选项变为可用/禁用
4. 点击禁用选项查看失败原因

条件类型：
- 金钱条件
- 物品条件
- 时间条件
- 天气条件
- 季节条件
- 属性条件
- 关系条件
- 复合条件（AND）
- OR条件
- NOT条件
- 位置条件
            `);
        }

        // 滚动到底部
        function scrollToBottom() {
            const container = document.querySelector('.scene-container');
            if (container) {
                container.scrollTo({
                    top: container.scrollHeight,
                    behavior: 'smooth'
                });
                console.log('📜 滚动到底部，容器高度:', container.scrollHeight);
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', () => {
            initSystems();

            // 延迟一下再运行测试
            setTimeout(() => {
                runTest();
            }, 100);
        });
    </script>
</body>
</html>
