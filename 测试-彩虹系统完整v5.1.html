<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩虹系统完整测试 v5.1 - 融合v4光漏效果</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 50%, #16213e 100%);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 350px;
            z-index: 10000;
            max-height: 90vh;
            overflow-y: auto;
        }

        .control-panel h2 {
            margin-bottom: 20px;
            font-size: 1.4em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .control-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-section:last-child {
            border-bottom: none;
        }

        .control-section h3 {
            margin-bottom: 12px;
            font-size: 1.1em;
            color: #87ceeb;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .button-group.single {
            grid-template-columns: 1fr;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 0 20px rgba(245, 87, 108, 0.5);
        }

        button.danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        button.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        /* 状态显示 */
        .status-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #999;
            font-size: 0.9em;
        }

        .status-value {
            color: #fff;
            font-weight: bold;
        }

        .status-value.positive {
            color: #38ef7d;
        }

        .status-value.negative {
            color: #f45c43;
        }

        .status-value.warning {
            color: #ffd700;
        }

        /* 版本切换 */
        .version-toggle {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .version-toggle button {
            flex: 1;
        }

        /* 日志 */
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.85em;
            font-family: 'Consolas', monospace;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 5px;
            border-left: 3px solid #667eea;
            background: rgba(255, 255, 255, 0.02);
        }

        .log-entry.success {
            border-left-color: #38ef7d;
        }

        .log-entry.warning {
            border-left-color: #ffd700;
        }

        .log-entry.error {
            border-left-color: #f45c43;
        }

        /* 游戏场景模拟 */
        .game-scene {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }

        .game-scene h3 {
            margin-bottom: 10px;
            color: #87ceeb;
        }

        .scene-info {
            font-size: 0.9em;
            line-height: 1.5;
        }

        .scene-info span {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 5px;
        }

        /* 天气特效容器 */
        .weather-effects-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* 彩虹容器基础 */
        .rainbow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* v5.0 原版样式（单渐变） */
        .rainbow-primary-v5 {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                transparent 10%,
                rgba(255, 0, 0, var(--opacity, 0.5)) 15%,
                rgba(255, 127, 0, var(--opacity, 0.5)) 20%,
                rgba(255, 255, 0, var(--opacity, 0.5)) 25%,
                rgba(0, 255, 0, var(--opacity, 0.5)) 30%,
                rgba(0, 127, 255, var(--opacity, 0.5)) 35%,
                rgba(0, 0, 255, var(--opacity, 0.5)) 40%,
                rgba(139, 0, 255, var(--opacity, 0.5)) 45%,
                transparent 50%,
                transparent 100%
            );
            filter: blur(var(--blur, 8px));
            mix-blend-mode: screen;
            transform: rotate(25deg) scale(2);
            transform-origin: center;
        }

        /* v5.1 光漏样式（融合v4） */
        .rainbow-light-leak {
            position: absolute;
            border-radius: 50%;
            filter: blur(var(--blur, 30px));
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* 梦幻漂浮动画 */
        @keyframes dream-float {
            0%, 100% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(30px, -20px) scale(1.1) rotate(5deg);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95) rotate(-5deg);
            }
        }

        /* 轻柔漂移 */
        @keyframes gentle-drift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: var(--base-opacity, 0.3);
            }
            50% {
                transform: translate(-15px, 15px) scale(1.05);
                opacity: calc(var(--base-opacity, 0.3) * 1.5);
            }
        }

        /* 光晕脉动 */
        @keyframes glow-pulse {
            0%, 100% {
                box-shadow: 0 0 30px currentColor;
            }
            50% {
                box-shadow: 0 0 60px currentColor, 0 0 100px currentColor;
            }
        }

        /* 星光效果 */
        .rainbow-sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 副彩虹 */
        .rainbow-secondary {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                transparent 18%,
                rgba(139, 0, 255, var(--opacity, 0.25)) 22%,
                rgba(0, 0, 255, var(--opacity, 0.25)) 26%,
                rgba(0, 127, 255, var(--opacity, 0.25)) 30%,
                rgba(0, 255, 0, var(--opacity, 0.25)) 34%,
                rgba(255, 255, 0, var(--opacity, 0.25)) 38%,
                rgba(255, 127, 0, var(--opacity, 0.25)) 42%,
                rgba(255, 0, 0, var(--opacity, 0.25)) 46%,
                transparent 50%,
                transparent 100%
            );
            filter: blur(var(--blur, 12px));
            mix-blend-mode: screen;
            transform: rotate(25deg) scale(2);
            transform-origin: center;
        }

        /* 亚历山大暗带 */
        .rainbow-dark-band {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                transparent 0%,
                transparent 35%,
                rgba(0, 0, 0, var(--opacity, 0.15)) 38%,
                rgba(0, 0, 0, var(--opacity, 0.15)) 42%,
                transparent 45%,
                transparent 100%
            );
            transform: rotate(25deg) scale(2);
            transform-origin: center;
            mix-blend-mode: multiply;
        }

        /* 出现动画 */
        @keyframes rainbow-appear {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 奖励出现动画 - 柔和渐现 */
        @keyframes rainbow-reward-appear {
            0% {
                opacity: 0;
                transform: scale(1);
                filter: blur(80px) brightness(2);
            }
            30% {
                opacity: 0.2;
                filter: blur(50px) brightness(1.8);
            }
            60% {
                opacity: 0.5;
                filter: blur(25px) brightness(1.4);
            }
            80% {
                opacity: 0.8;
                filter: blur(10px) brightness(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px) brightness(1);
            }
        }

        /* 自然消散动画 */
        @keyframes rainbow-disperse-natural-1 {
            0% {
                opacity: 1;
                transform: rotate(25deg) scale(2);
                filter: blur(var(--blur, 8px));
            }
            100% {
                opacity: 0;
                transform: rotate(35deg) scale(2.5) translateX(100px);
                filter: blur(30px);
            }
        }

        @keyframes rainbow-disperse-natural-2 {
            0% {
                opacity: 1;
                transform: rotate(25deg) scale(2);
                filter: blur(var(--blur, 12px));
            }
            100% {
                opacity: 0;
                transform: rotate(15deg) scale(2.3) translateY(-100px);
                filter: blur(40px);
            }
        }

        @keyframes rainbow-disperse-natural-3 {
            0% {
                opacity: 1;
                transform: rotate(25deg) scale(2);
                filter: blur(0);
            }
            100% {
                opacity: 0;
                transform: rotate(20deg) scale(2.8) translateX(-50px) translateY(50px);
                filter: blur(25px);
            }
        }

        /* 光漏消散 */
        @keyframes light-leak-disperse {
            0% {
                opacity: var(--base-opacity, 0.7);
                transform: translate(0, 0) scale(1);
                filter: blur(var(--blur, 30px));
            }
            100% {
                opacity: 0;
                transform: translate(var(--drift-x, 50px), var(--drift-y, -50px)) scale(1.5);
                filter: blur(60px);
            }
        }

        /* 雨滴效果 */
        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(174, 194, 224, 0.6) 50%,
                rgba(174, 194, 224, 0) 100%
            );
            animation: rain-fall linear infinite;
        }

        @keyframes rain-fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* 提示信息 */
        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            font-size: 1.1em;
            text-align: center;
            z-index: 10001;
            display: none;
        }

        .hint.show {
            display: block;
            animation: hint-pulse 2s ease-in-out infinite;
        }

        @keyframes hint-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }
    </style>
</head>
<body>
    <!-- 天气特效容器 -->
    <div class="weather-effects-container" id="weatherEffects"></div>

    <!-- 游戏场景信息 -->
    <div class="game-scene">
        <h3>🎮 场景信息</h3>
        <div class="scene-info">
            <span>📍 <span id="location">公园</span></span>
            <span>🌤️ <span id="weather">晴天</span></span>
            <span>🕐 <span id="time">14:30</span></span>
            <span>🌡️ <span id="temp">22°C</span></span>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <h2>🌈 彩虹系统控制台 v5.1</h2>

        <!-- 版本选择 -->
        <div class="control-section">
            <h3>🎨 彩虹版本</h3>
            <div class="version-toggle">
                <button onclick="setRainbowVersion('v5')" id="versionV5">v5.0 原版</button>
                <button onclick="setRainbowVersion('v51')" id="versionV51" class="active">v5.1 光漏版</button>
            </div>
        </div>

        <!-- 天气控制 -->
        <div class="control-section">
            <h3>☁️ 天气控制</h3>
            <div class="button-group">
                <button onclick="setWeather('sunny')">☀️ 晴天</button>
                <button onclick="setWeather('rainy')">🌧️ 雨天</button>
                <button onclick="setWeather('cloudy')">☁️ 多云</button>
                <button onclick="setWeather('stormy')">⛈️ 暴雨</button>
            </div>
        </div>

        <!-- 场景控制 -->
        <div class="control-section">
            <h3>📍 场景切换</h3>
            <div class="button-group">
                <button onclick="setLocation('park')">🌳 公园(室外)</button>
                <button onclick="setLocation('street')">🏙️ 街道(室外)</button>
                <button onclick="setLocation('home')">🏠 家里(室内)</button>
                <button onclick="setLocation('mall')">🏬 商场(室内)</button>
            </div>
        </div>

        <!-- 彩虹控制 -->
        <div class="control-section">
            <h3>🌈 彩虹控制</h3>
            <div class="button-group single">
                <button onclick="testAutoTrigger()" class="success">✨ 测试自动触发流程</button>
                <button onclick="forceShowRainbow()">🌈 强制显示彩虹</button>
                <button onclick="forceEndRainbow()" class="danger">❌ 强制结束彩虹</button>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="control-section">
            <h3>📊 系统状态</h3>
            <div class="status-display">
                <div class="status-item">
                    <span class="status-label">彩虹版本</span>
                    <span class="status-value warning" id="rainbowVersion">v5.1 光漏版</span>
                </div>
                <div class="status-item">
                    <span class="status-label">彩虹状态</span>
                    <span class="status-value" id="rainbowStatus">未显示</span>
                </div>
                <div class="status-item">
                    <span class="status-label">当前位置</span>
                    <span class="status-value" id="currentLocation">公园(室外)</span>
                </div>
                <div class="status-item">
                    <span class="status-label">上次天气</span>
                    <span class="status-value" id="lastWeather">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">触发条件</span>
                    <span class="status-value" id="triggerStatus">未满足</span>
                </div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="control-section">
            <h3>📝 系统日志</h3>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <!-- 提示信息 -->
    <div class="hint" id="hint"></div>

    <script>
        // 模拟游戏状态
        let gameState = {
            weather: 'sunny',
            previousWeather: null,
            location: 'park',
            isOutdoor: true,
            time: '14:30',
            temperature: 22,
            rainbowVersion: 'v51' // 默认使用v5.1
        };

        // 彩虹管理器
        class RainbowManager {
            constructor() {
                this.isActive = false;
                this.container = null;
                this.duration = 15000; // 15秒
                this.endTimer = null;
                this.init();
            }

            init() {
                this.log('彩虹管理器 v5.1 初始化完成', 'success');
                this.updateStatus();
            }

            checkTriggerConditions() {
                // 检查触发条件
                const conditions = {
                    wasRainy: gameState.previousWeather === 'rainy' || gameState.previousWeather === 'stormy',
                    isSunny: gameState.weather === 'sunny',
                    isOutdoor: gameState.isOutdoor
                };

                const shouldTrigger = conditions.wasRainy && conditions.isSunny && conditions.isOutdoor;

                this.log(`条件检查: 之前雨天=${conditions.wasRainy}, 现在晴天=${conditions.isSunny}, 室外=${conditions.isOutdoor}`,
                    shouldTrigger ? 'success' : 'warning');

                document.getElementById('triggerStatus').textContent = shouldTrigger ? '✅ 满足' : '❌ 未满足';
                document.getElementById('triggerStatus').className = shouldTrigger ? 'status-value positive' : 'status-value negative';

                return shouldTrigger;
            }

            startRainbow() {
                if (this.isActive) {
                    this.log('彩虹已在显示中', 'warning');
                    return;
                }

                this.log(`🌈 开始显示彩虹 (${gameState.rainbowVersion})`, 'success');
                this.isActive = true;

                // 创建彩虹容器
                this.container = document.createElement('div');
                this.container.className = 'rainbow-container';

                if (gameState.rainbowVersion === 'v51') {
                    // v5.1 光漏版本 - 使用更长的渐现时间
                    this.container.style.animation = 'rainbow-reward-appear 5s ease-out forwards';

                    // 创建多个光漏
                    const lightLeaks = [
                        // 红色爆发
                        {
                            top: '5%', left: '10%', width: '35%', height: '45%',
                            color1: '255, 100, 100', color2: '255, 180, 80',
                            blur: 25, opacity: 0.7, animation: 'dream-float 10s ease-in-out infinite'
                        },
                        // 金黄光芒
                        {
                            top: '0%', left: '35%', width: '40%', height: '40%',
                            color1: '255, 220, 100', color2: '255, 255, 150',
                            blur: 30, opacity: 0.65, animation: 'dream-float 12s ease-in-out infinite 1s'
                        },
                        // 翠绿生机
                        {
                            top: '8%', right: '10%', width: '45%', height: '50%',
                            color1: '100, 255, 150', color2: '150, 255, 200',
                            blur: 35, opacity: 0.6, animation: 'dream-float 15s ease-in-out infinite 2s'
                        },
                        // 蓝紫梦幻
                        {
                            top: '15%', left: '25%', width: '50%', height: '35%',
                            color1: '150, 150, 255', color2: '200, 100, 255',
                            blur: 28, opacity: 0.55, animation: 'gentle-drift 8s ease-in-out infinite'
                        },
                        // 紫罗兰辉光
                        {
                            bottom: '20%', right: '15%', width: '30%', height: '40%',
                            color1: '180, 100, 255', color2: '255, 100, 200',
                            blur: 32, opacity: 0.5, animation: 'gentle-drift 10s ease-in-out infinite 1.5s'
                        }
                    ];

                    lightLeaks.forEach((leak, index) => {
                        const element = document.createElement('div');
                        element.className = 'rainbow-light-leak';
                        element.style.top = leak.top;
                        element.style.left = leak.left;
                        element.style.right = leak.right;
                        element.style.bottom = leak.bottom;
                        element.style.width = leak.width;
                        element.style.height = leak.height;
                        element.style.background = `radial-gradient(ellipse at center,
                            rgba(${leak.color1}, ${leak.opacity}) 0%,
                            rgba(${leak.color2}, ${leak.opacity * 0.7}) 40%,
                            transparent 70%)`;
                        element.style.setProperty('--blur', `${leak.blur}px`);
                        element.style.setProperty('--base-opacity', leak.opacity);
                        element.style.animation = leak.animation;
                        this.container.appendChild(element);
                    });

                    // 添加星光点缀
                    for (let i = 0; i < 8; i++) {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'rainbow-sparkle';
                        sparkle.style.top = `${20 + Math.random() * 60}%`;
                        sparkle.style.left = `${10 + Math.random() * 80}%`;
                        sparkle.style.animationDelay = `${Math.random() * 3}s`;
                        this.container.appendChild(sparkle);
                    }

                } else {
                    // v5.0 原版
                    this.container.style.animation = 'rainbow-appear 3s ease-out forwards';

                    // 创建主彩虹
                    const primary = document.createElement('div');
                    primary.className = 'rainbow-primary-v5';
                    primary.style.setProperty('--opacity', '0.65');
                    primary.style.setProperty('--blur', '8px');
                    this.container.appendChild(primary);

                    // 创建副彩虹
                    const secondary = document.createElement('div');
                    secondary.className = 'rainbow-secondary';
                    secondary.style.setProperty('--opacity', '0.35');
                    secondary.style.setProperty('--blur', '12px');
                    this.container.appendChild(secondary);

                    // 创建亚历山大暗带
                    const darkBand = document.createElement('div');
                    darkBand.className = 'rainbow-dark-band';
                    darkBand.style.setProperty('--opacity', '0.2');
                    this.container.appendChild(darkBand);
                }

                // 添加到页面
                document.getElementById('weatherEffects').appendChild(this.container);

                // 更新状态
                this.updateStatus();

                // 设置自动消失
                this.endTimer = setTimeout(() => {
                    this.endRainbow();
                }, this.duration);

                this.log(`彩虹将在 ${this.duration/1000} 秒后自动消散`, 'success');
            }

            endRainbow() {
                if (!this.isActive || !this.container) {
                    return;
                }

                this.log('🌈 开始自然消散动画', 'success');

                // 清除定时器
                if (this.endTimer) {
                    clearTimeout(this.endTimer);
                    this.endTimer = null;
                }

                // 获取所有彩虹元素
                const elements = this.container.children;

                if (gameState.rainbowVersion === 'v51') {
                    // v5.1 光漏消散
                    Array.from(elements).forEach((element, index) => {
                        if (element.className === 'rainbow-light-leak') {
                            const duration = 2 + (index * 0.2);
                            const driftX = (Math.random() - 0.5) * 100;
                            const driftY = (Math.random() - 0.5) * 100;

                            element.style.setProperty('--drift-x', `${driftX}px`);
                            element.style.setProperty('--drift-y', `${driftY}px`);
                            element.style.animation = `light-leak-disperse ${duration}s ease-out forwards`;
                        } else if (element.className === 'rainbow-sparkle') {
                            element.style.opacity = '0';
                            element.style.transition = 'opacity 0.5s';
                        }
                    });
                } else {
                    // v5.0 原版消散
                    const disperseAnimations = [
                        'rainbow-disperse-natural-1',
                        'rainbow-disperse-natural-2',
                        'rainbow-disperse-natural-3'
                    ];

                    Array.from(elements).forEach((element, index) => {
                        const animationName = disperseAnimations[index % 3];
                        const duration = 3 + (index * 0.3);
                        const delay = index * 0.1;

                        element.style.animation = `${animationName} ${duration}s ease-out ${delay}s forwards`;
                    });
                }

                // 等待动画完成后移除
                setTimeout(() => {
                    if (this.container) {
                        this.container.remove();
                        this.container = null;
                    }
                    this.isActive = false;
                    this.updateStatus();
                    this.log('彩虹完全消失', 'success');
                }, 4000);
            }

            onWeatherChange(newWeather) {
                this.log(`天气变化: ${gameState.weather} → ${newWeather}`);

                gameState.previousWeather = gameState.weather;
                gameState.weather = newWeather;

                // 更新显示
                document.getElementById('weather').textContent = this.getWeatherName(newWeather);
                document.getElementById('lastWeather').textContent = this.getWeatherName(gameState.previousWeather);

                // 检查是否应该触发彩虹
                if (this.checkTriggerConditions()) {
                    // 模拟概率触发（30%概率）
                    const chance = Math.random();
                    if (chance < 0.3) {
                        this.log('🎲 概率检查通过 (30%)', 'success');
                        setTimeout(() => {
                            this.startRainbow();
                        }, 2000); // 延迟2秒出现
                    } else {
                        this.log(`🎲 概率检查未通过 (${(chance*100).toFixed(0)}%)`, 'warning');
                    }
                }
            }

            onLocationChange(newLocation, isOutdoor) {
                this.log(`场景切换: ${gameState.location} → ${newLocation}`);

                gameState.location = newLocation;
                gameState.isOutdoor = isOutdoor;

                // 更新显示
                document.getElementById('location').textContent = newLocation;
                document.getElementById('currentLocation').textContent = `${newLocation}(${isOutdoor ? '室外' : '室内'})`;

                // 如果进入室内，立即结束彩虹
                if (!isOutdoor && this.isActive) {
                    this.log('进入室内，彩虹消失', 'warning');
                    this.endRainbow();
                }
            }

            updateStatus() {
                const statusEl = document.getElementById('rainbowStatus');
                if (this.isActive) {
                    statusEl.textContent = '🌈 显示中';
                    statusEl.className = 'status-value positive';
                } else {
                    statusEl.textContent = '未显示';
                    statusEl.className = 'status-value';
                }
            }

            getWeatherName(weather) {
                const names = {
                    'sunny': '☀️ 晴天',
                    'cloudy': '☁️ 多云',
                    'rainy': '🌧️ 雨天',
                    'stormy': '⛈️ 暴雨'
                };
                return names[weather] || weather;
            }

            log(message, type = '') {
                const container = document.getElementById('logContainer');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                const time = new Date().toLocaleTimeString('zh-CN');
                entry.textContent = `[${time}] ${message}`;
                container.appendChild(entry);
                container.scrollTop = container.scrollHeight;

                console.log(`[RainbowManager] ${message}`);
            }
        }

        // 初始化彩虹管理器
        const rainbowManager = new RainbowManager();

        // 控制函数
        function setRainbowVersion(version) {
            gameState.rainbowVersion = version;

            // 更新按钮状态
            document.getElementById('versionV5').className = version === 'v5' ? 'active' : '';
            document.getElementById('versionV51').className = version === 'v51' ? 'active' : '';

            // 更新显示
            const versionText = version === 'v51' ? 'v5.1 光漏版' : 'v5.0 原版';
            document.getElementById('rainbowVersion').textContent = versionText;

            rainbowManager.log(`切换到 ${versionText}`, 'success');

            // 如果正在显示彩虹，重新显示
            if (rainbowManager.isActive) {
                rainbowManager.endRainbow();
                setTimeout(() => {
                    rainbowManager.startRainbow();
                }, 1000);
            }
        }

        function setWeather(weather) {
            // 清除现有雨滴
            const effects = document.getElementById('weatherEffects');
            const raindrops = effects.querySelectorAll('.raindrop');
            raindrops.forEach(drop => drop.remove());

            // 如果是雨天，添加雨滴
            if (weather === 'rainy' || weather === 'stormy') {
                const dropCount = weather === 'stormy' ? 100 : 50;
                for (let i = 0; i < dropCount; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    drop.style.left = `${Math.random() * 100}%`;
                    drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                    drop.style.animationDelay = `${Math.random() * 2}s`;
                    effects.appendChild(drop);
                }
            }

            // 通知管理器
            rainbowManager.onWeatherChange(weather);
        }

        function setLocation(location) {
            const locations = {
                'park': { name: '公园', outdoor: true },
                'street': { name: '街道', outdoor: true },
                'home': { name: '家里', outdoor: false },
                'mall': { name: '商场', outdoor: false }
            };

            const loc = locations[location];
            if (loc) {
                rainbowManager.onLocationChange(loc.name, loc.outdoor);
            }
        }

        function testAutoTrigger() {
            showHint('开始自动触发测试流程...');

            // Step 1: 设置为雨天
            setTimeout(() => {
                showHint('Step 1: 设置雨天');
                setWeather('rainy');
            }, 1000);

            // Step 2: 确保在室外
            setTimeout(() => {
                showHint('Step 2: 移动到室外');
                setLocation('park');
            }, 3000);

            // Step 3: 天气转晴
            setTimeout(() => {
                showHint('Step 3: 雨过天晴，等待彩虹...');
                setWeather('sunny');
            }, 5000);

            // 隐藏提示
            setTimeout(() => {
                hideHint();
            }, 8000);
        }

        function forceShowRainbow() {
            rainbowManager.startRainbow();
        }

        function forceEndRainbow() {
            rainbowManager.endRainbow();
        }

        function showHint(text) {
            const hint = document.getElementById('hint');
            hint.textContent = text;
            hint.className = 'hint show';
        }

        function hideHint() {
            const hint = document.getElementById('hint');
            hint.className = 'hint';
        }

        // 更新时间显示
        setInterval(() => {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }, 1000);

        // 初始化
        window.addEventListener('load', () => {
            rainbowManager.log('页面加载完成', 'success');
            rainbowManager.log('v5.1 新特性：融合v4光漏效果', 'success');
            rainbowManager.log('1. 多个光漏叠加，更梦幻', 'success');
            rainbowManager.log('2. 星光点缀效果', 'success');
            rainbowManager.log('3. 更高的不透明度', 'success');
            rainbowManager.log('4. 惊喜入场动画', 'success');
        });
    </script>
</body>
</html>
