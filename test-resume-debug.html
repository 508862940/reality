<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Resume功能诊断工具</title>
    <style>
        body {
            font-family: 'Consolas', monospace;
            background: #1a1a2e;
            color: #e4e4e7;
            padding: 20px;
        }
        .panel {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            opacity: 0.8;
        }
        pre {
            background: #0f0f1e;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Resume功能诊断工具</h1>

    <div class="panel">
        <h2>1️⃣ 检查系统状态</h2>
        <button onclick="checkSystemStatus()">开始诊断</button>
        <div id="system-status"></div>
    </div>

    <div class="panel">
        <h2>2️⃣ 检查存档</h2>
        <button onclick="checkSaves()">检查存档</button>
        <div id="saves-status"></div>
    </div>

    <div class="panel">
        <h2>3️⃣ 测试加载</h2>
        <button onclick="testLoad()">测试加载</button>
        <div id="load-status"></div>
    </div>

    <div class="panel">
        <h2>4️⃣ 清理并修复</h2>
        <button onclick="cleanAndFix()">清理旧数据</button>
        <button onclick="recreateSave()">重建存档系统</button>
        <div id="fix-status"></div>
    </div>

    <!-- 加载必要的脚本 -->
    <script src="js/lib/dexie.min.js"></script>
    <script src="js/core/database.js"></script>
    <script src="js/core/save-system.js"></script>
    <script src="js/core/world-state.js"></script>
    <script src="js/core/game-bootstrap.js"></script>

    <script>
        // 诊断脚本
        async function checkSystemStatus() {
            const output = document.getElementById('system-status');
            output.innerHTML = '<p>🔍 正在检查...</p>';

            let html = '<h3>系统检查结果：</h3>';

            // 检查IndexedDB
            try {
                html += '<p class="success">✅ IndexedDB可用</p>';
            } catch(e) {
                html += '<p class="error">❌ IndexedDB不可用: ' + e.message + '</p>';
            }

            // 检查Database
            if (window.Database) {
                html += '<p class="success">✅ Database对象存在</p>';
                try {
                    await window.Database.init();
                    html += '<p class="success">✅ Database初始化成功</p>';
                } catch(e) {
                    html += '<p class="error">❌ Database初始化失败: ' + e.message + '</p>';
                }
            } else {
                html += '<p class="error">❌ Database对象不存在</p>';
            }

            // 检查SaveSystem
            if (window.SaveSystem) {
                html += '<p class="success">✅ SaveSystem类存在</p>';
                try {
                    if (!window.saveSystem) {
                        window.saveSystem = new SaveSystem();
                    }
                    await window.saveSystem.init();
                    html += '<p class="success">✅ SaveSystem实例初始化成功</p>';
                } catch(e) {
                    html += '<p class="error">❌ SaveSystem初始化失败: ' + e.message + '</p>';
                }
            } else {
                html += '<p class="error">❌ SaveSystem类不存在</p>';
            }

            // 检查GameBootstrap
            if (window.GameBootstrap) {
                html += '<p class="success">✅ GameBootstrap类存在</p>';
                if (window.gameBootstrap) {
                    html += '<p class="success">✅ gameBootstrap实例存在</p>';
                } else {
                    html += '<p class="warning">⚠️ gameBootstrap实例未创建</p>';
                }
            } else {
                html += '<p class="error">❌ GameBootstrap类不存在</p>';
            }

            // 检查WorldState
            if (window.worldState) {
                html += '<p class="success">✅ worldState实例存在</p>';
            } else {
                html += '<p class="error">❌ worldState实例不存在</p>';
            }

            output.innerHTML = html;
        }

        async function checkSaves() {
            const output = document.getElementById('saves-status');
            output.innerHTML = '<p>🔍 正在检查存档...</p>';

            let html = '<h3>存档检查结果：</h3>';

            try {
                // 确保SaveSystem已初始化
                if (!window.saveSystem) {
                    await window.Database.init();
                    window.saveSystem = new SaveSystem();
                    await window.saveSystem.init();
                }

                // 获取所有存档
                const allSaves = await window.saveSystem.getSavesList();
                html += `<p>📦 找到 ${allSaves.length} 个存档</p>`;

                if (allSaves.length > 0) {
                    html += '<pre>';
                    allSaves.forEach(save => {
                        html += `\n[${save.type}] ID:${save.id} - ${save.name}`;
                        html += `\n  时间: ${new Date(save.timestamp).toLocaleString()}`;
                        html += `\n  大小: ${JSON.stringify(save.gameData || {}).length} 字节`;
                        html += `\n  有worldData: ${!!save.gameData?.worldData}`;
                        html += `\n  有scene: ${!!save.gameData?.scene}`;
                        html += `\n`;
                    });
                    html += '</pre>';
                } else {
                    html += '<p class="warning">⚠️ 没有找到存档</p>';
                }

                // 检查localStorage的旧存档
                const oldSave = localStorage.getItem('yoyo_game_state');
                if (oldSave) {
                    html += '<p class="warning">⚠️ 发现localStorage中的旧存档</p>';
                    try {
                        const data = JSON.parse(oldSave);
                        html += `<p>旧存档时间: ${new Date(data.timestamp).toLocaleString()}</p>`;
                    } catch(e) {
                        html += '<p class="error">❌ 旧存档数据损坏</p>';
                    }
                }

            } catch(e) {
                html += '<p class="error">❌ 检查存档时出错: ' + e.message + '</p>';
                html += '<pre>' + e.stack + '</pre>';
            }

            output.innerHTML = html;
        }

        async function testLoad() {
            const output = document.getElementById('load-status');
            output.innerHTML = '<p>🔍 正在测试加载...</p>';

            let html = '<h3>加载测试结果：</h3>';

            try {
                // 确保系统已初始化
                if (!window.gameBootstrap) {
                    window.gameBootstrap = new GameBootstrap();
                }

                // 检查是否有存档
                const hasSave = await window.gameBootstrap.hasSavedGame();
                html += `<p>有存档: ${hasSave ? '是' : '否'}</p>`;

                if (hasSave) {
                    html += '<p>🔄 尝试加载存档...</p>';

                    try {
                        const success = await window.gameBootstrap.loadGameState();

                        if (success) {
                            html += '<p class="success">✅ 加载成功！</p>';

                            // 检查恢复的数据
                            if (window.gameState) {
                                html += '<p>gameState已恢复</p>';
                                html += '<pre>' + JSON.stringify({
                                    character: window.gameState.character?.name,
                                    location: window.gameState.character?.location,
                                    restored: window.gameState.restored
                                }, null, 2) + '</pre>';
                            }

                            if (window.sceneManager && window.sceneManager.currentScene) {
                                html += '<p>场景已恢复: ' + window.sceneManager.currentScene.id + '</p>';
                            }
                        } else {
                            html += '<p class="error">❌ 加载失败（返回false）</p>';
                        }

                    } catch(e) {
                        html += '<p class="error">❌ 加载出错: ' + e.message + '</p>';
                        html += '<pre>' + e.stack + '</pre>';
                    }
                } else {
                    html += '<p class="warning">⚠️ 没有找到可用的存档</p>';
                }

            } catch(e) {
                html += '<p class="error">❌ 测试失败: ' + e.message + '</p>';
                html += '<pre>' + e.stack + '</pre>';
            }

            output.innerHTML = html;
        }

        async function cleanAndFix() {
            const output = document.getElementById('fix-status');

            if (!confirm('确定要清理旧数据吗？这将删除localStorage中的旧存档（IndexedDB存档不受影响）')) {
                return;
            }

            let html = '<h3>清理结果：</h3>';

            // 清理localStorage
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('yoyo_') || key.startsWith('save_')) {
                    keys.push(key);
                }
            }

            keys.forEach(key => {
                localStorage.removeItem(key);
                html += `<p>🗑️ 删除: ${key}</p>`;
            });

            html += '<p class="success">✅ 清理完成！</p>';
            output.innerHTML = html;
        }

        async function recreateSave() {
            const output = document.getElementById('fix-status');
            output.innerHTML = '<p>🔄 正在重建存档系统...</p>';

            let html = '<h3>重建结果：</h3>';

            try {
                // 删除现有数据库
                html += '<p>删除旧数据库...</p>';
                await Dexie.delete('yoyo_game_db');

                // 重新初始化
                html += '<p>初始化新数据库...</p>';
                await window.Database.init();

                html += '<p>创建新的SaveSystem...</p>';
                window.saveSystem = new SaveSystem();
                await window.saveSystem.init();

                html += '<p class="success">✅ 存档系统重建成功！</p>';
                html += '<p class="warning">⚠️ 注意：旧存档已被清空，请重新开始游戏</p>';

            } catch(e) {
                html += '<p class="error">❌ 重建失败: ' + e.message + '</p>';
                html += '<pre>' + e.stack + '</pre>';
            }

            output.innerHTML = html;
        }

        // 自动运行初始诊断
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkSystemStatus, 1000);
        });
    </script>
</body>
</html>
